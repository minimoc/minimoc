<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>miniMoc Editor</title>
  <script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone@7.27.1/babel.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #111827;
      color: #f9fafb;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ── HEADER ── */
    .header {
      background: #1f2937;
      border-bottom: 1px solid #374151;
      padding: 0 24px;
      height: 56px;
      display: flex;
      align-items: center;
      gap: 12px;
      position: sticky;
      top: 0;
      z-index: 100;
      flex-shrink: 0;
    }
    .logo {
      font-size: 18px;
      font-weight: 700;
      letter-spacing: 0.08em;
      color: #10b981;
      text-transform: uppercase;
      margin-right: 4px;
    }
    .logo span { color: #f9fafb; }
    .fw-version-badge {
      font-size: 11px;
      color: #9ca3af;
      background: #111827;
      border: 1px solid #374151;
      border-radius: 999px;
      padding: 2px 8px;
      white-space: nowrap;
    }
    .header-sep { width: 1px; height: 28px; background: #374151; flex-shrink: 0; }
    .compat-banner {
      background: #451a03;
      color: #fcd34d;
      border-bottom: 1px solid #92400e;
      padding: 8px 24px;
      font-size: 13px;
      line-height: 1.5;
    }
    .compat-banner a { color: #fcd34d; text-decoration: underline; }
    .midi-select {
      background: #111827;
      border: 1px solid #374151;
      color: #f9fafb;
      border-radius: 6px;
      padding: 4px 8px;
      font-size: 13px;
      cursor: pointer;
      max-width: 230px;
    }
    .midi-select:focus { outline: none; border-color: #10b981; }
    .conn-dot {
      width: 10px; height: 10px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .conn-dot.connected    { background: #10b981; box-shadow: 0 0 6px #10b981aa; }
    .conn-dot.disconnected { background: #6b7280; }
    .conn-label { font-size: 12px; color: #9ca3af; white-space: nowrap; }
    .spacer { flex: 1; }
    .preset-area {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }
    .preset-label { font-size: 13px; color: #9ca3af; }
    .preset-spinner {
      display: flex;
      align-items: center;
      gap: 2px;
    }
    .preset-num {
      font-size: 15px;
      font-weight: 700;
      color: #f9fafb;
      min-width: 26px;
      text-align: center;
    }
    .dirty-star { color: #f59e0b; }
    .preset-arrow {
      background: none;
      border: 1px solid #374151;
      color: #9ca3af;
      border-radius: 4px;
      width: 22px; height: 22px;
      font-size: 12px;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: background 0.12s;
    }
    .preset-arrow:hover { background: #374151; color: #f9fafb; }

    .btn {
      padding: 5px 14px;
      border-radius: 6px;
      border: 1px solid #374151;
      background: #374151;
      color: #f9fafb;
      font-size: 13px;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s;
      white-space: nowrap;
    }
    .btn:hover:not(:disabled) { background: #4b5563; border-color: #6b7280; }
    .btn:disabled { opacity: 0.35; cursor: not-allowed; }
    .btn.primary {
      background: #10b981;
      border-color: #10b981;
      color: #fff;
    }
    .btn.primary:hover:not(:disabled) { background: #059669; border-color: #059669; }
    .btn.danger {
      background: transparent;
      border-color: #ef4444;
      color: #ef4444;
    }
    .btn.danger:hover:not(:disabled) { background: #ef444422; }
    .btn.amber {
      background: #f59e0b;
      border-color: #d97706;
      color: #111827;
      font-weight: 600;
    }
    .btn.amber:hover:not(:disabled) { background: #d97706; }

    /* ── LAYOUT ── */
    .app-body {
      display: flex;
      flex: 1;
      overflow: hidden;
      height: calc(100vh - 56px);
    }
    .sidebar {
      width: 200px;
      background: #1f2937;
      border-right: 1px solid #374151;
      padding: 20px 0;
      display: flex;
      flex-direction: column;
      gap: 2px;
      flex-shrink: 0;
      overflow-y: auto;
    }
    .nav-link {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 20px;
      color: #9ca3af;
      cursor: pointer;
      font-size: 13px;
      font-weight: 500;
      border-left: 3px solid transparent;
      transition: color 0.15s, background 0.15s;
      user-select: none;
    }
    .nav-link:hover { color: #f9fafb; background: #ffffff0a; }
    .nav-link.active { color: #10b981; border-left-color: #10b981; background: #10b98110; }
    .nav-icon { font-size: 15px; width: 20px; text-align: center; }
    .sidebar-footer-link {
      margin-top: auto;
      padding: 10px 20px;
      font-size: 11px;
      color: #6b7280;
    }
    .sidebar-footer-link a { color: #6b7280; }
    .sidebar-footer-link a:hover { color: #9ca3af; }

    .main-content {
      flex: 1;
      overflow-y: auto;
      padding: 28px 32px;
    }

    /* ── SECTION TITLES ── */
    .section-title {
      font-size: 20px;
      font-weight: 700;
      color: #f9fafb;
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .section-title .badge {
      font-size: 11px;
      font-weight: 600;
      background: #374151;
      color: #9ca3af;
      padding: 2px 8px;
      border-radius: 12px;
      letter-spacing: 0.05em;
    }
    .panel {
      background: #1f2937;
      border: 1px solid #374151;
      border-radius: 10px;
      padding: 20px;
      margin-bottom: 20px;
    }
    .panel-hint {
      color: #9ca3af;
      font-size: 13px;
      margin-bottom: 16px;
      line-height: 1.5;
    }
    .bpm-control { margin-top: 20px; }
    .bpm-control label {
      display: block;
      font-size: 13px;
      color: #d1d5db;
      margin-bottom: 8px;
      font-weight: 600;
    }
    .bpm-row { display: flex; align-items: center; gap: 14px; }
    .bpm-btn {
      width: 40px;
      height: 40px;
      border-radius: 8px;
      border: 1px solid #374151;
      background: #111827;
      color: #f9fafb;
      font-size: 20px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.15s;
    }
    .bpm-btn:hover { border-color: #10b981; color: #10b981; }
    .bpm-btn:active { background: #10b98122; }
    .bpm-value {
      font-size: 16px;
      font-weight: 700;
      color: #f9fafb;
      min-width: 90px;
      text-align: center;
    }
    .bpm-control .panel-hint { margin: 8px 0 0; }

    .transport-row { display: flex; gap: 10px; }
    .transport-btn {
      width: 52px;
      height: 44px;
      border-radius: 8px;
      border: 1px solid #374151;
      background: #111827;
      color: #f9fafb;
      font-size: 20px;
      cursor: pointer;
      transition: all 0.15s;
    }
    .transport-btn:hover { border-color: #10b981; color: #10b981; }
    .transport-btn:active { background: #10b98122; }
    .transport-btn.active {
      background: #10b981;
      border-color: #10b981;
      color: #111827;
    }

    /* ── NO MIDI ── */
    .no-midi {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      min-height: 360px;
      color: #9ca3af;
      text-align: center;
    }
    .no-midi .icon { font-size: 52px; }
    .no-midi h2   { font-size: 20px; color: #f9fafb; }
    .no-midi p    { font-size: 14px; max-width: 380px; line-height: 1.65; }

    /* ── SYNC SECTION ── */
    .sync-grid {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }
    .sync-box {
      width: 108px;
      height: 60px;
      border-radius: 10px;
      border: 2px solid #374151;
      background: #111827;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.15s;
      color: #6b7280;
      user-select: none;
      text-align: center;
      padding: 0 6px;
    }
    .sync-box:hover { border-color: #6b7280; color: #d1d5db; }
    .sync-box.active {
      background: #f9fafb;
      border-color: #f9fafb;
      color: #111827;
      box-shadow: 0 0 16px #f9fafb44;
    }

    /* ── MATRICE SECTION ── */
    .matrix-table {
      border-collapse: collapse;
      font-size: 13px;
    }
    .matrix-table th, .matrix-table td {
      text-align: center;
      padding: 5px 6px;
    }
    .matrix-table th {
      color: #9ca3af;
      font-weight: 600;
      font-size: 12px;
      padding-bottom: 10px;
    }
    .matrix-table th.col-group-trs  { color: #6b7280; }
    .matrix-table th.col-group-host { color: #8b5cf6; }
    .matrix-table td.row-label.row-label-trs  { color: #6b7280; }
    .matrix-table td.row-label.row-label-host { color: #8b5cf6; }
    .matrix-table .row-sublabel { font-size: 9px; color: #4b5563; display: block; margin-top: 1px; line-height: 1; }
    .matrix-table td.row-label {
      color: #9ca3af;
      font-weight: 600;
      text-align: right;
      padding-right: 14px;
      font-size: 14px;
    }
    .matrix-cell {
      width: 36px;
      height: 36px;
      border-radius: 6px;
      border: 1px solid #374151;
      background: #111827;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: all 0.12s;
      font-size: 13px;
      color: transparent;
    }
    .matrix-cell:hover { border-color: #6b7280; background: #1f2937; }
    .matrix-cell.on {
      background: #10b981;
      border-color: #10b981;
      color: #064e3b;
    }
    .matrix-cell.on::after { content: "✓"; }

    /* ── FLUX SECTION ── */
    .flux-list { display: flex; flex-direction: column; gap: 6px; }
    .flux-row {
      display: flex;
      align-items: center;
      gap: 10px;
      background: #111827;
      border: 1px solid #374151;
      border-radius: 8px;
      padding: 9px 14px;
    }
    .flux-index {
      font-family: 'Courier New', monospace;
      font-size: 12px;
      color: #6b7280;
      min-width: 26px;
    }
    .flux-active-dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .flux-active-dot.on  { background: #10b981; }
    .flux-active-dot.off { background: #4b5563; }
    .flux-summary {
      flex: 1;
      font-family: 'Courier New', monospace;
      font-size: 13px;
      color: #d1d5db;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .flux-actions { display: flex; gap: 6px; flex-shrink: 0; }
    .btn-sm {
      padding: 3px 10px;
      font-size: 12px;
      border-radius: 5px;
      border: 1px solid #374151;
      background: #374151;
      color: #f9fafb;
      cursor: pointer;
      transition: background 0.12s;
      white-space: nowrap;
    }
    .btn-sm:hover { background: #4b5563; }
    .btn-sm.danger { border-color: #ef444455; background: transparent; color: #ef4444; }
    .btn-sm.danger:hover { background: #ef444420; }
    .btn-sm.toggle-on  { background: #10b98122; border-color: #10b981; color: #10b981; }
    .btn-sm.toggle-off { background: transparent; border-color: #6b7280;  color: #6b7280; }

    /* ── FLUX EDITOR ── */
    .flux-editor {
      background: #111827;
      border: 1px solid #374151;
      border-radius: 10px;
      padding: 22px;
      margin-top: 14px;
    }
    .flux-editor-title {
      font-size: 15px;
      font-weight: 600;
      color: #f9fafb;
      margin-bottom: 18px;
    }
    .flux-editor-row {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      margin-bottom: 16px;
    }
    .flux-editor-label {
      font-size: 12px;
      color: #9ca3af;
      font-weight: 600;
      min-width: 64px;
      padding-top: 9px;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }
    .port-buttons {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }
    .port-btn-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
    }
    .port-btn {
      width: 42px;
      height: 38px;
      border-radius: 7px;
      border: 1px solid #374151;
      background: #1f2937;
      color: #9ca3af;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.12s;
    }
    .port-btn:hover { border-color: #6b7280; color: #f9fafb; }
    .port-btn.on {
      background: #10b981;
      border-color: #10b981;
      color: #fff;
    }
    .chan-hint-btn {
      font-size: 9px;
      color: #6b7280;
      font-family: 'Courier New', monospace;
      background: none;
      border: 1px solid #37415188;
      border-radius: 3px;
      padding: 1px 4px;
      cursor: pointer;
      transition: all 0.12s;
      max-width: 42px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .chan-hint-btn:hover { border-color: #6b7280; color: #d1d5db; }
    .chan-hint-btn.set   { color: #10b981; border-color: #10b98155; }
    .chan-hint-spacer    { height: 17px; }

    .flux-editor-actions {
      display: flex;
      gap: 10px;
      margin-top: 8px;
      padding-top: 16px;
      border-top: 1px solid #374151;
    }

    /* ── CHANNEL PICKER MODAL ── */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: #000000aa;
      z-index: 300;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .modal {
      background: #1f2937;
      border: 1px solid #374151;
      border-radius: 12px;
      padding: 22px;
      min-width: 300px;
      max-width: 340px;
      box-shadow: 0 20px 60px #00000088;
    }
    .modal-title {
      font-size: 14px;
      font-weight: 600;
      color: #f9fafb;
      margin-bottom: 16px;
    }
    .preset-grid {
      display: grid;
      grid-template-columns: repeat(8, 1fr);
      gap: 5px;
      margin-bottom: 18px;
    }
    .preset-grid-btn {
      height: 30px;
      border-radius: 5px;
      border: 1px solid #374151;
      background: #111827;
      color: #9ca3af;
      font-size: 12px;
      cursor: pointer;
      transition: background .1s, color .1s;
    }
    .preset-grid-btn:hover  { background: #374151; color: #f9fafb; }
    .preset-grid-btn.active { background: #10b981; border-color: #10b981; color: #fff; font-weight: 700; }
    .preset-grid-btn.current { border-color: #6b7280; color: #f9fafb; }
    .factory-row { display: flex; gap: 7px; margin-bottom: 18px; flex-wrap: wrap; }
    .factory-btn {
      flex: 1; min-width: 60px; height: 30px;
      border-radius: 5px; border: 1px solid #374151;
      background: #111827; color: #9ca3af;
      font-size: 11px; cursor: pointer; transition: background .1s, color .1s;
    }
    .factory-btn:hover { background: #8b5cf622; border-color: #8b5cf6; color: #c4b5fd; }
    .factory-section-label { font-size: 10px; color: #4b5563; text-transform: uppercase;
      letter-spacing: .05em; margin-bottom: 7px; }
    .ch-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
      margin-bottom: 16px;
    }
    .ch-btn {
      height: 34px;
      border-radius: 5px;
      border: 1px solid #374151;
      background: #111827;
      color: #9ca3af;
      font-size: 13px;
      cursor: pointer;
      transition: all 0.12s;
    }
    .ch-btn:hover { border-color: #6b7280; color: #f9fafb; }
    .ch-btn.on {
      background: #10b981;
      border-color: #10b981;
      color: #fff;
    }
    .ch-all-btn {
      grid-column: span 4;
      height: 32px;
      border-radius: 5px;
      border: 1px solid #374151;
      background: #374151;
      color: #f9fafb;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.12s;
      margin-bottom: 2px;
    }
    .ch-all-btn:hover { background: #4b5563; }
    .ch-all-btn.on { background: #10b981; border-color: #10b981; }
    .modal-actions { display: flex; gap: 8px; justify-content: flex-end; }

    /* ── HOST CONFIG ── */
    .mode-pill {
      display: inline-flex;
      border: 1px solid #374151;
      border-radius: 8px;
      overflow: hidden;
      margin-bottom: 20px;
    }
    .mode-pill-btn {
      padding: 8px 24px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      border: none;
      background: transparent;
      color: #9ca3af;
      transition: all 0.15s;
    }
    .mode-pill-btn.active { background: #10b981; color: #fff; }

    .host-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }
    .host-table th {
      text-align: left;
      padding: 8px 14px;
      color: #9ca3af;
      font-size: 12px;
      font-weight: 600;
      border-bottom: 1px solid #374151;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }
    .host-table td {
      padding: 11px 14px;
      border-bottom: 1px solid #37415155;
      vertical-align: middle;
    }
    .host-table tr:last-child td { border-bottom: none; }
    .port-label-badge {
      font-family: 'Courier New', monospace;
      font-size: 13px;
      font-weight: 700;
      background: #374151;
      color: #f9fafb;
      padding: 3px 10px;
      border-radius: 5px;
    }
    .slot-select {
      background: #111827;
      border: 1px solid #374151;
      color: #f9fafb;
      border-radius: 6px;
      padding: 5px 10px;
      font-size: 13px;
      cursor: pointer;
    }
    .slot-select:focus { outline: none; border-color: #10b981; }
    .slot-select:disabled { opacity: 0.4; cursor: not-allowed; }
    .host-desc { color: #6b7280; font-size: 12px; }

    /* ── TOAST ── */
    .toast {
      position: fixed;
      bottom: 24px;
      right: 24px;
      background: #1f2937;
      border: 1px solid #374151;
      border-radius: 8px;
      padding: 10px 18px;
      font-size: 13px;
      color: #f9fafb;
      z-index: 500;
      box-shadow: 0 4px 24px #00000066;
      animation: slideUp 0.2s ease;
    }
    .toast.success { border-color: #10b981; color: #10b981; }
    .toast.error   { border-color: #ef4444; color: #ef4444; }
    .toast.info    { border-color: #60a5fa; color: #60a5fa; }
    @keyframes slideUp {
      from { transform: translateY(16px); opacity: 0; }
      to   { transform: translateY(0);    opacity: 1; }
    }

    /* ── MISC ── */
    .warning-note {
      background: #f59e0b18;
      border: 1px solid #f59e0b44;
      border-radius: 6px;
      padding: 8px 14px;
      font-size: 12px;
      color: #f59e0b;
      margin-top: 14px;
    }

    /* ── SCROLLBAR ── */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: #111827; }
    ::-webkit-scrollbar-thumb { background: #374151; border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: #4b5563; }

    /* ── FIRMWARE UPGRADE ── */
    .fw-zone {
      border: 2px dashed #374151;
      border-radius: 10px;
      padding: 36px 24px;
      text-align: center;
      cursor: pointer;
      transition: all 0.2s;
      color: #6b7280;
      font-size: 14px;
    }
    .fw-zone:hover, .fw-zone.over {
      border-color: #10b981;
      color: #10b981;
      background: #10b98108;
    }
    .fw-zone-icon { font-size: 40px; margin-bottom: 12px; }

    .fw-file-info {
      display: flex;
      align-items: center;
      gap: 14px;
      background: #111827;
      border: 1px solid #374151;
      border-radius: 8px;
      padding: 12px 16px;
      font-size: 13px;
    }
    .fw-info-name { font-weight: 600; color: #f9fafb; }

<body>
<div id="root"></div>

<script type="text/babel">
const { useState, useEffect, useRef, useCallback } = React;

// ── Constants ────────────────────────────────────────────────────────────────
const MANUFACTURER_ID = 0x7D;
// Bumper à chaque changement de protocole SysEx incompatible avec un firmware
// antérieur, et archiver alors l'ancien index.html dans versions/ — voir
// versions.json (manifest de compatibilité) et le bandeau affiché par App().
const WEBLINK_VERSION = '0.3.0';
// Préfixe relatif vers la racine weblink/ : '' pour ce fichier (la racine),
// '../../' pour une copie archivée dans versions/vX.Y.Z/. Sert à tous les
// fetch/href qui doivent atteindre versions.json ou firmwares/ quelle que
// soit la profondeur du fichier — voir memory "weblink_versioning".
const WEBLINK_BASE = '';
// Enregistrement MIDI continu sur SD reporté après la V1 (cf. firmware/sd_recorder.h,
// SD_RECORDER_ENABLED désactivé) — le convertisseur DAT → MIDI n'a plus lieu d'être
// tant qu'aucun firmware ne produit de fichier .DAT. Onglet masqué, code conservé
// pour réactivation le jour où l'enregistrement est fini et relivré.
const DAT2MIDI_ENABLED = false;
const N_IN   = 5;
const N_OUT  = 9;
const IN_LABELS  = ['A', 'B', 'C', 'D', 'E'];
const OUT_LABELS = ['1', '2', '3', '4', '5', '6', '7', '8', '9'];
// Doit rester synchronisé avec SYNC_LABELS dans firmware/logic.h.
// Index 0-9 : lettre + TRS (physique DIN) ou USB Host (0-4) / câble USB miroir
// PC (5-9). Index 10 : MINIMOC (horloge interne). "OFF" n'a pas d'index côté
// firmware : sur le fil c'est la valeur spéciale 0x7F.
const SYNC_LABELS = [
  'A-TRS', 'B-TRS', 'C-HOST', 'D-HOST', 'E-HOST',
  'A-USB', 'B-USB', 'C-USB', 'D-USB', 'E-USB',
  'MINIMOC', 'OFF',
];

// Doit rester synchronisé avec le switch de PCEditor.h (case 0x11).
const TRANSPORT_ACTION = { PLAY_PAUSE: 0, STOP: 1, RECORD: 2, FAST_FORWARD: 3, REWIND: 4 };
const MIN_PRESET = 1;
const MAX_PRESET = 32;

const FACTORY_PRESETS_WEB = [
  { name: 'Vide',      matrix: [0x000, 0x000, 0x000, 0x000, 0x000] },
  { name: 'Diagonale', matrix: [0x001, 0x002, 0x004, 0x008, 0x010] },
  { name: 'Merge',     matrix: [0x001, 0x001, 0x001, 0x001, 0x001] },
  { name: 'Dispatch',  matrix: [0x1FF, 0x000, 0x000, 0x000, 0x000] },
  { name: 'Total',     matrix: [0x1FF, 0x1FF, 0x1FF, 0x1FF, 0x1FF] },
  { name: 'Split',     matrix: [0x007, 0x038, 0x000, 0x000, 0x000] },
  { name: 'USB→TRS',  matrix: [0x000, 0x000, 0x001, 0x002, 0x004] },
  { name: 'TRS→USB',  matrix: [0x040, 0x080, 0x000, 0x000, 0x000] },
];

// ── SysEx helpers ────────────────────────────────────────────────────────────
function sysexMsg(body) {
  return new Uint8Array([0xF0, ...body, 0xF7]);
}

// ── Version compare (tolère le suffixe lettre : v0.2.2 < v0.2.2a < v0.2.2b) ──
function parseVersion(v) {
  const m = /^v?(\d+)\.(\d+)\.(\d+)([a-z]*)$/i.exec((v || '').trim());
  if (!m) return null;
  return { major: +m[1], minor: +m[2], patch: +m[3], suffix: m[4].toLowerCase() };
}

// -1 si a<b, 0 si égal, 1 si a>b, null si l'une des deux chaînes est invalide
function compareVersions(a, b) {
  const pa = parseVersion(a), pb = parseVersion(b);
  if (!pa || !pb) return null;
  for (const k of ['major', 'minor', 'patch']) {
    if (pa[k] !== pb[k]) return pa[k] < pb[k] ? -1 : 1;
  }
  if (pa.suffix !== pb.suffix) return pa.suffix < pb.suffix ? -1 : 1;
  return 0;
}

function encodeFluxMsg(idx, flux) {
  // TransformType : 0=aucun 1=transpose 2=harmonize 3=chord harmonize (cf. PCEditor.h)
  const tr = flux.transform || { type: 0, transpose: 0, intervals: [0, 0, 0, 0], root_key: 0, progression_id: 0, bars_per_chord: CHORD_BARS_DEFAULT };
  // Compacte les intervalles non-nuls dans l'ordre (0 = slot inutilisé) —
  // le firmware ne lit que les n_intervals premiers, sans filtrer les trous.
  const nonzero = (tr.intervals || []).filter(v => v);
  const intervals = [0, 0, 0, 0];
  nonzero.slice(0, 4).forEach((v, i) => { intervals[i] = v; });
  const data = [
    MANUFACTURER_ID, 0x0A,
    idx,
    flux.in.length,
    flux.out.length,
    1, // toujours actif
    tr.type || 0,
    (tr.transpose || 0) + 64,          // biaisé +64 pour rester dans 0-127 (SysEx 7 bits)
    Math.min(nonzero.length, 4),        // n_intervals
    ...intervals.map(v => v + 64),
    tr.root_key || 0,                   // 0-11, non biaisé (petit entier non signé)
    tr.progression_id || 0,             // 0-3, non biaisé
    tr.bars_per_chord || CHORD_BARS_DEFAULT,   // 1-8, non biaisé
  ];
  // chan_mask encodé sur 3 octets 7-bit : bits 0-6 | bits 7-13 | bits 14-15
  for (const i of flux.in) {
    data.push(i.port, i.chan_mask & 0x7F, (i.chan_mask >> 7) & 0x7F, (i.chan_mask >> 14) & 0x03);
  }
  for (const o of flux.out) {
    data.push(o.port, o.chan_mask & 0x7F, (o.chan_mask >> 7) & 0x7F, (o.chan_mask >> 14) & 0x03);
  }
  return sysexMsg(data);
}

function fluxSummary(flux) {
  const ins = (flux.in || []).map(i => {
    const p = IN_LABELS[i.port] || '?';
    if (!i.chan_mask) return p;
    const bits = [];
    for (let b = 0; b < 16; b++) if (i.chan_mask & (1 << b)) bits.push(b + 1);
    return bits.length === 1 ? `${p}:${bits[0]}` : `${p}(${bits.length})`;
  }).join(' ');
  const outs = (flux.out || []).map(o => {
    const p = o.port + 1;
    if (!o.chan_mask) return `${p}`;
    const bits = [];
    for (let b = 0; b < 16; b++) if (o.chan_mask & (1 << b)) bits.push(b + 1);
    return bits.length === 1 ? `${p}:${bits[0]}` : `${p}(${bits.length})`;
  }).join(' ');
  if (!ins && !outs) return '(vide)';
  const tr = flux.transform;
  let trSuffix = '';
  if (tr && tr.type === 1 && tr.transpose) {
    trSuffix = ` (T${tr.transpose > 0 ? '+' : ''}${tr.transpose})`;
  } else if (tr && tr.type === 2) {
    const n = (tr.intervals || []).filter(v => v).length;
    if (n > 0) trSuffix = ` (H×${n})`;
  } else if (tr && tr.type === 3) {
    const root = ROOT_KEY_LABELS[tr.root_key || 0];
    const prog = PROGRESSION_LABELS[tr.progression_id || 0];
    trSuffix = ` (${root}:${prog})`;
  }
  return `${ins || '?'} → ${outs || '?'}${trSuffix}`;
}

function chanMaskLabel(mask) {
  if (!mask) return 'ALL';
  const bits = [];
  for (let b = 0; b < 16; b++) if (mask & (1 << b)) bits.push(b + 1);
  if (bits.length === 0) return 'ALL';
  if (bits.length <= 3)  return bits.map(b => `ch${b}`).join(',');
  return `×${bits.length}ch`;
}

// ── Générateurs (LFO / Euclidien / Motif) ───────────────────────────────────
// Doit rester synchronisé avec Generator/GeneratorType dans firmware/logic.h
// et le protocole opcodes 0x12/0x13 dans firmware/PCEditor.h.
const GEN_LFO = 0, GEN_EUCLID = 1, GEN_PATTERN = 2;
const LFO_SYNC_FREE = 0, LFO_SYNC_CLOCK = 1;
const LFO_WAVEFORM_LABELS = ['Triangle', 'Sinus', 'Carré', 'Scie', 'Aléatoire'];
const LFO_WAVEFORM_SHORT  = ['Tri', 'Sin', 'Car', 'Sci', 'Ale'];
const LFO_DIVISIONS = [
  { label: '1/16', ticks: 6 }, { label: '1/8', ticks: 12 }, { label: '1/4', ticks: 24 },
  { label: '1/2', ticks: 48 }, { label: '1', ticks: 96 }, { label: '2', ticks: 192 }, { label: '4', ticks: 384 },
];
const GEN_MAX = 16;   // aligné sur FLUX_MAX côté firmware (logic.h)
const EUCLID_STEPS_MAX = 16;
const LFO_RATE_X10HZ_MIN = 1;    // 0.1 Hz
const LFO_RATE_X10HZ_MAX = 500;  // 50.0 Hz
// Noms uniquement — le contenu des motifs (DRUM_PATTERNS dans logic.h) reste
// firmware-only, le web ne fait que choisir un index. Ordre et nombre à
// garder synchronisés avec logic.h (même précédent que LFO_DIVISIONS).
const DRUM_PATTERN_NAMES = ['Amen Break', 'Funky Drummer', 'Backbeat Simple'];

function defaultGenerator() {
  return {
    type: GEN_LFO, active: true, waveform: 0, sync_mode: LFO_SYNC_FREE, rate_x10hz: 10,
    division_idx: 2, depth: 63, center: 64, cc_number: 1, note: 60,
    euclid_steps: 8, euclid_pulses: 3, euclid_rotation: 0, gate_percent: 50,
    pattern_id: 0, out: [],
  };
}

function encodeGeneratorMsg(idx, gen) {
  const rate = gen.rate_x10hz || 10;
  const data = [
    MANUFACTURER_ID, 0x12,
    idx,
    gen.type || 0,
    gen.active === false ? 0 : 1,
    gen.waveform || 0,
    gen.sync_mode || 0,
    rate & 0x7F, (rate >> 7) & 0x7F,          // rate_x10hz : 2 octets 7-bit (comme le BPM)
    gen.division_idx || 0,
    gen.depth || 0,
    gen.center || 0,
    gen.cc_number || 0,
    gen.note || 0,
    gen.euclid_steps || 8,
    gen.euclid_pulses || 0,
    gen.euclid_rotation || 0,
    gen.gate_percent || 50,
    gen.out.length,
  ];
  // chan_mask encodé sur 3 octets 7-bit : bits 0-6 | bits 7-13 | bits 14-15
  for (const o of gen.out) {
    data.push(o.port, o.chan_mask & 0x7F, (o.chan_mask >> 7) & 0x7F, (o.chan_mask >> 14) & 0x03);
  }
  data.push(gen.pattern_id || 0);   // octet ajouté en fin de message (v9, cf. PCEditor.h)
  return sysexMsg(data);
}

function generatorSummary(g) {
  const rateOrDiv = g.sync_mode === LFO_SYNC_CLOCK
    ? (LFO_DIVISIONS[g.division_idx] || LFO_DIVISIONS[2]).label
    : `${(g.rate_x10hz / 10).toFixed(1)}Hz`;
  let head;
  if (g.type === GEN_PATTERN) {
    head = `Pat ${DRUM_PATTERN_NAMES[g.pattern_id] || '?'} ${rateOrDiv}`;
  } else if (g.type === GEN_EUCLID) {
    head = `Euc ${g.euclid_pulses}/${g.euclid_steps} ${rateOrDiv} N${g.note}`;
  } else {
    head = `${LFO_WAVEFORM_SHORT[g.waveform] || '?'} ${rateOrDiv} CC${g.cc_number}`;
  }
  const outs = (g.out || []).map(o => {
    const p = o.port + 1;
    if (!o.chan_mask) return `${p}:0c`;   // ne devrait pas arriver (élagué à l'édition) — visible si ça arrive quand même
    const bits = [];
    for (let b = 0; b < 16; b++) if (o.chan_mask & (1 << b)) bits.push(b + 1);
    return bits.length === 1 ? `${p}:${bits[0]}` : `${p}(${bits.length})`;
  }).join(' ');
  return `${head} → ${outs || '?'}`;
}

// ── Intel HEX + OTA WebSerial helpers ────────────────────────────────────────

function parseIntelHex(text) {
  const segments = [];
  let extBase = 0;
  for (const raw of text.split('\n')) {
    const ln = raw.trim();
    if (!ln.startsWith(':') || ln.length < 11) continue;
    const byteCount = parseInt(ln.slice(1,  3), 16);
    const addr16    = parseInt(ln.slice(3,  7), 16);
    const recType   = parseInt(ln.slice(7,  9), 16);
    if (recType === 0x01) break;
    if (recType === 0x04) {
      extBase = ((parseInt(ln.slice(9,  11), 16) << 8) |
                  parseInt(ln.slice(11, 13), 16)) << 16;
      continue;
    }
    if (recType !== 0x00) continue;
    const bytes = new Uint8Array(byteCount);
    for (let i = 0; i < byteCount; i++)
      bytes[i] = parseInt(ln.slice(9 + i*2, 11 + i*2), 16);
    segments.push({ addr: extBase + addr16, bytes });
  }
  if (!segments.length) throw new Error('Aucune donnée dans ce fichier HEX');
  const minAddr = segments.reduce((m, s) => Math.min(m, s.addr), Infinity);
  const maxAddr = segments.reduce((m, s) => Math.max(m, s.addr + s.bytes.length), 0);
  return { segments, minAddr, maxAddr };
}

function hexToBinary(parsedHex) {
  const { segments, minAddr, maxAddr } = parsedHex;
  const buf = new Uint8Array(maxAddr - minAddr).fill(0xFF);
  for (const seg of segments) buf.set(seg.bytes, seg.addr - minAddr);
  return buf;
}

function crc32(data) {
  // IEEE 802.3 — doit correspondre à l'implémentation C++ sur le Teensy
  const lut = new Uint32Array(256);
  for (let i = 0; i < 256; i++) {
    let c = i;
    for (let j = 0; j < 8; j++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
    lut[i] = c;
  }
  let crc = 0xFFFFFFFF;
  for (let i = 0; i < data.length; i++) crc = lut[(crc ^ data[i]) & 0xFF] ^ (crc >>> 8);
  return (crc ^ 0xFFFFFFFF) >>> 0;
}

class SerialLineReader {
  constructor(readable) {
    this._reader = readable.getReader();
    this._buf    = '';
    this._dec    = new TextDecoder();
  }
  async readLine(timeoutMs = 5000) {
    const deadline = Date.now() + timeoutMs;
    while (true) {
      const nl = this._buf.indexOf('\n');
      if (nl >= 0) {
        const line = this._buf.slice(0, nl).replace(/\r$/, '');
        this._buf  = this._buf.slice(nl + 1);
        return line;
      }
      const ms = deadline - Date.now();
      if (ms <= 0) throw new Error('Timeout — pas de réponse du Teensy');
      let timer;
      const chunk = await Promise.race([
        this._reader.read(),
        new Promise((_, r) => { timer = setTimeout(() => r(new Error('Timeout — pas de réponse du Teensy')), ms); }),
      ]).finally(() => clearTimeout(timer));
      if (chunk.done) throw new Error('Port série fermé de façon inattendue');
      this._buf += this._dec.decode(chunk.value, { stream: true });
    }
  }
  releaseLock() { try { this._reader.releaseLock(); } catch(_) {} }
}

async function otaFlash(port, binary, onProgress, onStatus) {
  await port.open({ baudRate: 115200 });
  const writer = port.writable.getWriter();
  const reader = new SerialLineReader(port.readable);
  const enc    = new TextEncoder();
  try {
    onStatus('Ping…');
    await writer.write(enc.encode('PING\n'));
    const pong = await reader.readLine(4000);
    if (pong !== 'PONG:READY') throw new Error(`Réponse inattendue au PING : "${pong || '(vide)'}"`);

    onStatus('Démarrage du transfert…');
    await writer.write(enc.encode(`START_UPDATE:${binary.length}\n`));
    const ack0 = await reader.readLine(5000);
    if (ack0 !== 'ACK') throw new Error(`Erreur démarrage : "${ack0}"`);

    const CHUNK = 256;
    const total = Math.ceil(binary.length / CHUNK);
    for (let i = 0; i < total; i++) {
      await writer.write(binary.slice(i * CHUNK, (i + 1) * CHUNK));
      const ack = await reader.readLine(6000);
      if (ack !== 'ACK') throw new Error(`Erreur chunk ${i + 1}/${total} : "${ack}"`);
      onProgress((i + 1) / total);
      onStatus(`Chunk ${i + 1}/${total}`);
    }

    onStatus('Vérification CRC…');
    const crcHex = crc32(binary).toString(16).padStart(8, '0');
    await writer.write(enc.encode(`END_UPDATE:${crcHex}\n`));
    const result = await reader.readLine(8000);
    if (result !== 'OK') throw new Error(`Validation échouée : "${result}"`);

    onStatus('Succès — Teensy redémarre sur le nouveau firmware…');
  } finally {
    try { writer.releaseLock(); } catch(_) {}
    reader.releaseLock();
    await new Promise(r => setTimeout(r, 400));
    try { await port.close(); } catch(_) {}
  }
}

function makeDefaultState() {
  return {
    basicMatrix: Array(N_IN).fill(0),
    fluxes:      [],
    generators:  [],
    syncMaster:  0x7F,
    hostMode:     0,
    portSlot:     [0, 1, 2, 0, 1, 2],
    deviceNames:  ['', '', '', '', '', ''],  // noms des slots D1..D6
    preset:      1,
    internalBpm: 100,   // tempo de l'horloge interne MINIMOC (source SYNC 10)
    firmwareVersion: '',
  };
}

// ── Channel Picker Modal ─────────────────────────────────────────────────────
// allowAll : Flux utilise chan_mask=0 comme "passthrough" (bouton ALL) —
// un Générateur n'a pas de canal source à passthrough (0 canal = rien
// envoyé), donc GeneratorEditor passe allowAll={false} pour masquer ce bouton.
// ── Appui maintenu (+/-) : un pas immédiat, puis répétition continue tant que
// le bouton reste enfoncé. Mécanisme partagé par tous les steppers de l'appli
// (BPM, transpose, harmonize, générateurs...) — voir Stepper ci-dessous pour
// l'usage courant, ou useHoldRepeat() directement pour un cas sur-mesure
// (ex. le control BPM, qui a son propre layout/CSS).
function useHoldRepeat(delayMs = 350, repeatMs = 90) {
  const ref = useRef({ timeout: null, interval: null });

  function stop() {
    clearTimeout(ref.current.timeout);
    clearInterval(ref.current.interval);
    ref.current.timeout  = null;
    ref.current.interval = null;
  }

  // fn doit lire l'état le plus récent via la forme fonctionnelle du setState
  // qu'elle appelle (setXxx(prev => ...)) — sinon, comme fn est capturée une
  // seule fois par setInterval, les répétitions rejoueraient toutes le même
  // pas figé au lieu d'accumuler (cf. commentaire historique sur le BPM).
  function start(fn) {
    fn();
    stop();
    ref.current.timeout = setTimeout(() => {
      ref.current.interval = setInterval(fn, repeatMs);
    }, delayMs);
  }

  // Coupe la répétition si le pointeur quitte la fenêtre encore enfoncé (drag hors bouton, etc.)
  useEffect(() => {
    window.addEventListener('mouseup', stop);
    window.addEventListener('touchend', stop);
    return () => {
      window.removeEventListener('mouseup', stop);
      window.removeEventListener('touchend', stop);
      stop();
    };
  }, []);

  return { start, stop };
}

// ── Stepper générique −/valeur/+ avec appui maintenu ────────────────────────
// onStep(delta) reçoit ±1 à chaque pas ; l'appelant est responsable d'utiliser
// la forme fonctionnelle de son setState pour rester correct sous répétition
// (cf. useHoldRepeat ci-dessus).
function Stepper({ value, onStep, min, max, format, width = 40, children }) {
  const { start, stop } = useHoldRepeat();
  const dec = () => onStep(-1);
  const inc = () => onStep(1);
  return (
    <div className="port-buttons" style={{ alignItems: 'center', gap: 8 }}>
      <button
        className="btn"
        disabled={value <= min}
        onMouseDown={() => start(dec)} onMouseUp={stop} onMouseLeave={stop}
        onTouchStart={e => { e.preventDefault(); start(dec); }} onTouchEnd={stop}
      >−</button>
      <span style={{ minWidth: width, textAlign: 'center', fontVariantNumeric: 'tabular-nums' }}>
        {format ? format(value) : value}
      </span>
      <button
        className="btn"
        disabled={value >= max}
        onMouseDown={() => start(inc)} onMouseUp={stop} onMouseLeave={stop}
        onTouchStart={e => { e.preventDefault(); start(inc); }} onTouchEnd={stop}
      >+</button>
      {children}
    </div>
  );
}

function ChanPickerModal({ title, initMask, onConfirm, onCancel, allowAll = true }) {
  const [mask, setMask] = useState(initMask);
  const allOff = mask === 0;

  function toggle(b) { setMask(prev => prev ^ (1 << b)); }

  return (
    <div className="modal-overlay" onClick={e => { if (e.target === e.currentTarget) onCancel(); }}>
      <div className="modal" onClick={e => e.stopPropagation()}>
        <div className="modal-title">{title}</div>
        <div className="ch-grid">
          {allowAll && (
            <button
              className={`ch-all-btn${allOff ? ' on' : ''}`}
              onClick={() => setMask(0)}
            >
              ALL — passthrough (aucun filtre)
            </button>
          )}
          {Array.from({ length: 16 }, (_, i) => (
            <button
              key={i}
              className={`ch-btn${(mask & (1 << i)) ? ' on' : ''}`}
              onClick={() => toggle(i)}
            >
              {i + 1}
            </button>
          ))}
        </div>
        <div className="modal-actions">
          <button className="btn" onClick={onCancel}>Annuler</button>
          <button className="btn primary" onClick={() => onConfirm(mask)}>OK</button>
        </div>
      </div>
    </div>
  );
}

// ── Flux Editor ──────────────────────────────────────────────────────────────
const TRANSFORM_NONE           = 0;
const TRANSFORM_TRANSPOSE      = 1;
const TRANSFORM_HARMONIZE      = 2;
const TRANSFORM_CHORD_HARMONIZE = 3;
const HARMONIZE_MAX_INTERVALS = 4;

// Miroir des tables harmony.h (firmware) — TRANSFORM_CHORD_HARMONIZE
// Libellés complets (pas de contrainte d'écran ici, contrairement à l'OLED
// du device qui doit tronquer avec "..." — cf. PROGRESSION_PRESETS[i].short_label)
const ROOT_KEY_LABELS = ['Do','Do#','Ré','Ré#','Mi','Fa','Fa#','Sol','Sol#','La','La#','Si'];
const PROGRESSION_LABELS = [
  'I - V - vi - IV',
  'ii7 - V7 - Imaj7',
  'I - vi - IV - V',
  'vi - IV - I - V',
  'I - IV - V',
  'I - IV - vi - V',
  'vi7 - ii7 - V7 - Imaj7',
  'Imaj7 - vi7 - ii7 - V7',
  'I7 - IV7 - V7',
  'I - V - vi - iii - IV - I - IV - V',
];
const PROGRESSION_DESCRIPTIONS = [
  'Progression pop la plus utilisée (« Axis progression »)',
  'Cadence jazz ii-V-I, la plus classique',
  'Progression doo-wop des années 50',
  'Variante pop de la « Axis progression »',
  "Le trio d'accords du rock'n'roll et du blues-rock",
  'Variante pop très employée (proche de « Africa » - Toto)',
  'Turnaround jazz classique avant le ii-V-I',
  'Base des « Rhythm Changes » (I Got Rhythm)',
  'Le squelette harmonique du blues (dominante partout)',
  'La progression du Canon de Pachelbel',
];
const CHORD_BARS_MIN = 1;
const CHORD_BARS_MAX = 8;
const CHORD_BARS_DEFAULT = 1;

function FluxEditor({ editingFlux, editingIdx, onSave, onCancel }) {
  const [draft, setDraft] = useState(() => {
    if (editingFlux) return JSON.parse(JSON.stringify(editingFlux));
    return { in: [], out: [], active: true, transform: { type: TRANSFORM_NONE, transpose: 0, intervals: [0, 0, 0, 0], root_key: 0, progression_id: 0, bars_per_chord: CHORD_BARS_DEFAULT } };
  });
  const [picker, setPicker] = useState(null); // {side, port}

  const transform = draft.transform || { type: TRANSFORM_NONE, transpose: 0, intervals: [0, 0, 0, 0], root_key: 0, progression_id: 0, bars_per_chord: CHORD_BARS_DEFAULT };

  function setTransformType(type) {
    setDraft(f => ({ ...f, transform: { ...(f.transform || {}), type,
      transpose: (f.transform && f.transform.transpose) || 0,
      intervals: (f.transform && f.transform.intervals) || [0, 0, 0, 0],
      root_key: (f.transform && f.transform.root_key) || 0,
      progression_id: (f.transform && f.transform.progression_id) || 0,
      bars_per_chord: (f.transform && f.transform.bars_per_chord) || CHORD_BARS_DEFAULT } }));
  }

  function setTranspose(v) {
    const clamped = Math.max(-24, Math.min(24, v));
    setDraft(f => ({ ...f, transform: { ...f.transform, transpose: clamped } }));
  }

  // Forme fonctionnelle (lit "f", pas "transform" via la fermeture) —
  // indispensable pour l'appui maintenu (cf. useHoldRepeat()).
  function stepTranspose(delta) {
    setDraft(f => ({ ...f, transform: { ...f.transform,
      transpose: Math.max(-24, Math.min(24, f.transform.transpose + delta)) } }));
  }

  function stepInterval(slot, delta) {
    setDraft(f => {
      const intervals = [...(f.transform.intervals || [0, 0, 0, 0])];
      intervals[slot] = Math.max(-24, Math.min(24, intervals[slot] + delta));
      return { ...f, transform: { ...f.transform, intervals } };
    });
  }

  function stepBarsPerChord(delta) {
    setDraft(f => ({ ...f, transform: { ...f.transform,
      bars_per_chord: Math.max(CHORD_BARS_MIN, Math.min(CHORD_BARS_MAX, (f.transform.bars_per_chord || CHORD_BARS_DEFAULT) + delta)) } }));
  }

  function setInterval(slot, v) {
    const clamped = Math.max(-24, Math.min(24, v));
    setDraft(f => {
      const intervals = [...(f.transform.intervals || [0, 0, 0, 0])];
      intervals[slot] = clamped;
      return { ...f, transform: { ...f.transform, intervals } };
    });
  }

  function setRootKey(v) {
    const clamped = Math.max(0, Math.min(11, v));
    setDraft(f => ({ ...f, transform: { ...f.transform, root_key: clamped } }));
  }

  function setProgressionId(v) {
    const clamped = Math.max(0, Math.min(PROGRESSION_LABELS.length - 1, v));
    setDraft(f => ({ ...f, transform: { ...f.transform, progression_id: clamped } }));
  }

  function toggleIn(portIdx) {
    setDraft(f => {
      const has = f.in.some(x => x.port === portIdx);
      return has
        ? { ...f, in: f.in.filter(x => x.port !== portIdx) }
        : { ...f, in: [...f.in, { port: portIdx, chan_mask: 0 }] };
    });
  }

  function toggleOut(portIdx) {
    setDraft(f => {
      const has = f.out.some(x => x.port === portIdx);
      return has
        ? { ...f, out: f.out.filter(x => x.port !== portIdx) }
        : { ...f, out: [...f.out, { port: portIdx, chan_mask: 0 }] };
    });
  }

  function openPicker(side, port) { setPicker({ side, port }); }

  function applyMask(mask) {
    const { side, port } = picker;
    setPicker(null);
    setDraft(f => {
      if (side === 'in') {
        return { ...f, in:  f.in.map(x  => x.port === port ? { ...x, chan_mask: mask } : x) };
      } else {
        return { ...f, out: f.out.map(x => x.port === port ? { ...x, chan_mask: mask } : x) };
      }
    });
  }

  const pickerEntry = picker
    ? (picker.side === 'in'
        ? draft.in.find(x  => x.port === picker.port)
        : draft.out.find(x => x.port === picker.port))
    : null;

  const valid = draft.in.length > 0 && draft.out.length > 0;

  return (
    <div className="flux-editor">
      <div className="flux-editor-title">
        {editingIdx === null ? 'Nouveau flux' : `Modifier F${editingIdx + 1}`}
      </div>

      {/* Input ports */}
      <div className="flux-editor-row">
        <div className="flux-editor-label">Entrées</div>
        <div className="port-buttons">
          {IN_LABELS.map((lbl, i) => {
            const entry = draft.in.find(x => x.port === i);
            const on    = !!entry;
            return (
              <div key={i} className="port-btn-wrap">
                <button
                  className={`port-btn${on ? ' on' : ''}`}
                  onClick={() => toggleIn(i)}
                >
                  {lbl}
                </button>
                {on ? (
                  <button
                    className={`chan-hint-btn${entry.chan_mask ? ' set' : ''}`}
                    onClick={() => openPicker('in', i)}
                    title="Filtrer par canal"
                  >
                    {chanMaskLabel(entry.chan_mask)}
                  </button>
                ) : (
                  <div className="chan-hint-spacer" />
                )}
              </div>
            );
          })}
        </div>
      </div>

      {/* Output ports */}
      <div className="flux-editor-row">
        <div className="flux-editor-label">Sorties</div>
        <div className="port-buttons">
          {OUT_LABELS.map((lbl, i) => {
            const entry = draft.out.find(x => x.port === i);
            const on    = !!entry;
            return (
              <div key={i} className="port-btn-wrap">
                <button
                  className={`port-btn${on ? ' on' : ''}`}
                  onClick={() => toggleOut(i)}
                >
                  {lbl}
                </button>
                {on ? (
                  <button
                    className={`chan-hint-btn${entry.chan_mask ? ' set' : ''}`}
                    onClick={() => openPicker('out', i)}
                    title="Filtrer par canal"
                  >
                    {chanMaskLabel(entry.chan_mask)}
                  </button>
                ) : (
                  <div className="chan-hint-spacer" />
                )}
              </div>
            );
          })}
        </div>
      </div>

      {/* Transform : Aucun / Transpose / Harmonize (un seul actif à la fois) */}
      <div className="flux-editor-row">
        <div className="flux-editor-label">Transform</div>
        <div className="port-buttons" style={{ gap: 8 }}>
          <button className={`btn${transform.type === TRANSFORM_NONE ? ' primary' : ''}`} onClick={() => setTransformType(TRANSFORM_NONE)}>Aucun</button>
          <button className={`btn${transform.type === TRANSFORM_TRANSPOSE ? ' primary' : ''}`} onClick={() => setTransformType(TRANSFORM_TRANSPOSE)}>Transpose</button>
          <button className={`btn${transform.type === TRANSFORM_HARMONIZE ? ' primary' : ''}`} onClick={() => setTransformType(TRANSFORM_HARMONIZE)}>Harmonize</button>
          <button className={`btn${transform.type === TRANSFORM_CHORD_HARMONIZE ? ' primary' : ''}`} onClick={() => setTransformType(TRANSFORM_CHORD_HARMONIZE)}>Accords</button>
        </div>
      </div>

      {transform.type === TRANSFORM_TRANSPOSE && (
        <div className="flux-editor-row">
          <div className="flux-editor-label">Demi-tons</div>
          <Stepper
            value={transform.transpose} onStep={stepTranspose} min={-24} max={24}
            format={v => v > 0 ? `+${v}` : v}
          >
            {transform.transpose !== 0 && (
              <button className="btn" onClick={() => setTranspose(0)} title="Réinitialiser">Reset</button>
            )}
          </Stepper>
        </div>
      )}

      {transform.type === TRANSFORM_HARMONIZE && Array.from({ length: HARMONIZE_MAX_INTERVALS }).map((_, slot) => {
        const v = (transform.intervals && transform.intervals[slot]) || 0;
        return (
          <div className="flux-editor-row" key={slot}>
            <div className="flux-editor-label">Note {slot + 1}</div>
            <Stepper
              value={v} onStep={delta => stepInterval(slot, delta)} min={-24} max={24}
              format={v => v ? (v > 0 ? `+${v}` : v) : '--'}
            >
              {v !== 0 && (
                <button className="btn" onClick={() => setInterval(slot, 0)} title="Désactiver cette note">Reset</button>
              )}
            </Stepper>
          </div>
        );
      })}

      {transform.type === TRANSFORM_CHORD_HARMONIZE && (
        <>
          <div className="flux-editor-row">
            <div className="flux-editor-label">Tonique</div>
            <select
              value={transform.root_key || 0}
              onChange={e => setRootKey(parseInt(e.target.value, 10))}
            >
              {ROOT_KEY_LABELS.map((lbl, i) => <option key={i} value={i}>{lbl}</option>)}
            </select>
          </div>
          <div className="flux-editor-row">
            <div className="flux-editor-label">Progression</div>
            <select
              value={transform.progression_id || 0}
              onChange={e => setProgressionId(parseInt(e.target.value, 10))}
            >
              {PROGRESSION_LABELS.map((lbl, i) => <option key={i} value={i}>{lbl}</option>)}
            </select>
          </div>
          <div className="flux-editor-row">
            <div className="flux-editor-label"></div>
            <div style={{ fontSize: 12, color: '#9ca3af' }}>
              {PROGRESSION_DESCRIPTIONS[transform.progression_id || 0]}
            </div>
          </div>
          <div className="flux-editor-row">
            <div className="flux-editor-label">Mesures/accord</div>
            <Stepper
              value={transform.bars_per_chord || CHORD_BARS_DEFAULT} onStep={stepBarsPerChord}
              min={CHORD_BARS_MIN} max={CHORD_BARS_MAX}
            />
          </div>
        </>
      )}

      <div className="flux-editor-actions">
        <button
          className="btn primary"
          disabled={!valid}
          onClick={() => onSave(draft)}
        >
          Valider
        </button>
        <button className="btn" onClick={onCancel}>Annuler</button>
        {!valid && (
          <span style={{ fontSize: 12, color: '#9ca3af', alignSelf: 'center' }}>
            Sélectionnez au moins une entrée et une sortie
          </span>
        )}
      </div>

      {picker && (
        <ChanPickerModal
          title={`Canaux — ${picker.side === 'in' ? 'Entrée ' + IN_LABELS[picker.port] : 'Sortie ' + OUT_LABELS[picker.port]}`}
          initMask={pickerEntry ? pickerEntry.chan_mask : 0}
          onConfirm={applyMask}
          onCancel={() => setPicker(null)}
        />
      )}
    </div>
  );
}

// ── Generator Editor ─────────────────────────────────────────────────────────
function GeneratorEditor({ editingGenerator, editingIdx, onSave, onCancel }) {
  const [draft, setDraft] = useState(() =>
    editingGenerator ? JSON.parse(JSON.stringify(editingGenerator)) : defaultGenerator()
  );
  const [picker, setPicker] = useState(null); // {port}

  function set(field, value) { setDraft(g => ({ ...g, [field]: value })); }   // sélecteurs (type/waveform/sync_mode/division) — pas d'appui maintenu

  // Formes fonctionnelles (lisent "g", pas "draft" via la fermeture) —
  // indispensable pour l'appui maintenu (cf. useHoldRepeat()/Stepper).
  function stepRate(delta)     { setDraft(g => ({ ...g, rate_x10hz: Math.max(LFO_RATE_X10HZ_MIN, Math.min(LFO_RATE_X10HZ_MAX, g.rate_x10hz + delta)) })); }
  function stepDepth(delta)    { setDraft(g => ({ ...g, depth: Math.max(0, Math.min(63, g.depth + delta)) })); }
  function stepCenter(delta)   { setDraft(g => ({ ...g, center: Math.max(0, Math.min(127, g.center + delta)) })); }
  function stepCC(delta)       { setDraft(g => ({ ...g, cc_number: Math.max(0, Math.min(127, g.cc_number + delta)) })); }
  function stepNote(delta)     { setDraft(g => ({ ...g, note: Math.max(0, Math.min(127, g.note + delta)) })); }
  function stepGate(delta)     { setDraft(g => ({ ...g, gate_percent: Math.max(1, Math.min(100, g.gate_percent + delta)) })); }
  function stepPulses(delta)   { setDraft(g => ({ ...g, euclid_pulses: Math.max(0, Math.min(g.euclid_steps, g.euclid_pulses + delta)) })); }
  function stepRotation(delta) { setDraft(g => ({ ...g, euclid_rotation: Math.max(0, Math.min(Math.max(0, g.euclid_steps - 1), g.euclid_rotation + delta)) })); }

  // Changer le nombre de pas garde pulses/rotation dans les nouvelles bornes
  // — même geste que GS_STEPS côté firmware (generators_submenu.h).
  function stepSteps(delta) {
    setDraft(g => {
      const steps = Math.max(1, Math.min(EUCLID_STEPS_MAX, g.euclid_steps + delta));
      return {
        ...g, euclid_steps: steps,
        euclid_pulses: Math.min(g.euclid_pulses, steps),
        euclid_rotation: Math.min(g.euclid_rotation, steps - 1),
      };
    });
  }

  function toggleOut(portIdx) {
    setDraft(g => {
      const has = g.out.some(x => x.port === portIdx);
      return has
        ? { ...g, out: g.out.filter(x => x.port !== portIdx) }
        : { ...g, out: [...g.out, { port: portIdx, chan_mask: 0 }] };
    });
  }

  function openPicker(port) { setPicker({ port }); }

  // Contrairement à Flux, chan_mask=0 n'a pas de sens pour un générateur (pas
  // de canal source à "passthrough" : 0 canal = rien envoyé) — si le picker
  // se ferme sans qu'aucun canal soit coché, le port est retiré plutôt que de
  // garder une entrée fantôme (même logique que generators_submenu.h côté
  // firmware, cf. _gs_prune_empty_outs()).
  function applyMask(mask) {
    const port = picker.port;
    setPicker(null);
    setDraft(g => {
      if (mask === 0) return { ...g, out: g.out.filter(x => x.port !== port) };
      return { ...g, out: g.out.map(x => x.port === port ? { ...x, chan_mask: mask } : x) };
    });
  }

  const pickerEntry = picker ? draft.out.find(x => x.port === picker.port) : null;
  const valid = draft.out.length > 0 && draft.out.every(o => o.chan_mask !== 0);

  return (
    <div className="flux-editor">
      <div className="flux-editor-title">
        {editingIdx === null ? 'Nouveau générateur' : `Modifier L${editingIdx + 1}`}
      </div>

      {/* Type */}
      <div className="flux-editor-row">
        <div className="flux-editor-label">Type</div>
        <div className="port-buttons" style={{ gap: 8 }}>
          <button className={`btn${draft.type === GEN_LFO ? ' primary' : ''}`} onClick={() => set('type', GEN_LFO)}>LFO</button>
          <button className={`btn${draft.type === GEN_EUCLID ? ' primary' : ''}`} onClick={() => set('type', GEN_EUCLID)}>Euclidien</button>
          <button
            className={`btn${draft.type === GEN_PATTERN ? ' primary' : ''}`}
            onClick={() => setDraft(g => ({ ...g, type: GEN_PATTERN, sync_mode: LFO_SYNC_CLOCK }))}
          >
            Motif
          </button>
        </div>
      </div>

      {draft.type === GEN_LFO && (
        <div className="flux-editor-row">
          <div className="flux-editor-label">Forme d'onde</div>
          <div className="port-buttons" style={{ gap: 8, flexWrap: 'wrap' }}>
            {LFO_WAVEFORM_LABELS.map((lbl, i) => (
              <button key={i} className={`btn${draft.waveform === i ? ' primary' : ''}`} onClick={() => set('waveform', i)}>{lbl}</button>
            ))}
          </div>
        </div>
      )}

      {/* Synchro — partagée LFO/Euclidien ; un Motif est toujours synchro
          (forcé au choix du type ci-dessus), pas de bascule à proposer */}
      {draft.type !== GEN_PATTERN && (
        <div className="flux-editor-row">
          <div className="flux-editor-label">Synchro</div>
          <div className="port-buttons" style={{ gap: 8 }}>
            <button className={`btn${draft.sync_mode === LFO_SYNC_FREE ? ' primary' : ''}`} onClick={() => set('sync_mode', LFO_SYNC_FREE)}>Libre (Hz)</button>
            <button className={`btn${draft.sync_mode === LFO_SYNC_CLOCK ? ' primary' : ''}`} onClick={() => set('sync_mode', LFO_SYNC_CLOCK)}>Synchro</button>
          </div>
        </div>
      )}

      {draft.sync_mode === LFO_SYNC_FREE ? (
        <div className="flux-editor-row">
          <div className="flux-editor-label">Fréquence</div>
          <Stepper
            value={draft.rate_x10hz} onStep={stepRate} min={LFO_RATE_X10HZ_MIN} max={LFO_RATE_X10HZ_MAX}
            format={v => `${(v / 10).toFixed(1)} Hz`} width={60}
          />
        </div>
      ) : (
        <div className="flux-editor-row">
          <div className="flux-editor-label">Division</div>
          <select value={draft.division_idx} onChange={e => set('division_idx', parseInt(e.target.value, 10))}>
            {LFO_DIVISIONS.map((d, i) => <option key={i} value={i}>{d.label}</option>)}
          </select>
        </div>
      )}

      {draft.type === GEN_LFO ? (
        <>
          <div className="flux-editor-row">
            <div className="flux-editor-label">Amplitude</div>
            <Stepper value={draft.depth} onStep={stepDepth} min={0} max={63} />
          </div>
          <div className="flux-editor-row">
            <div className="flux-editor-label">Valeur centrale</div>
            <Stepper value={draft.center} onStep={stepCenter} min={0} max={127} />
          </div>
          <div className="flux-editor-row">
            <div className="flux-editor-label">Numéro CC</div>
            <Stepper value={draft.cc_number} onStep={stepCC} min={0} max={127} />
          </div>
        </>
      ) : draft.type === GEN_EUCLID ? (
        <>
          <div className="flux-editor-row">
            <div className="flux-editor-label">Note</div>
            <Stepper value={draft.note} onStep={stepNote} min={0} max={127} />
          </div>
          <div className="flux-editor-row">
            <div className="flux-editor-label">Pas</div>
            <Stepper value={draft.euclid_steps} onStep={stepSteps} min={1} max={EUCLID_STEPS_MAX} />
          </div>
          <div className="flux-editor-row">
            <div className="flux-editor-label">Pulses</div>
            <Stepper value={draft.euclid_pulses} onStep={stepPulses} min={0} max={draft.euclid_steps} />
          </div>
          <div className="flux-editor-row">
            <div className="flux-editor-label">Rotation</div>
            <Stepper value={draft.euclid_rotation} onStep={stepRotation} min={0} max={Math.max(0, draft.euclid_steps - 1)} />
          </div>
          <div className="flux-editor-row">
            <div className="flux-editor-label">Gate</div>
            <Stepper value={draft.gate_percent} onStep={stepGate} min={1} max={100} format={v => `${v}%`} width={50} />
          </div>
        </>
      ) : (
        <>
          <div className="flux-editor-row">
            <div className="flux-editor-label">Motif</div>
            <select value={draft.pattern_id} onChange={e => set('pattern_id', parseInt(e.target.value, 10))}>
              {DRUM_PATTERN_NAMES.map((name, i) => <option key={i} value={i}>{name}</option>)}
            </select>
          </div>
          <div className="flux-editor-row">
            <div className="flux-editor-label">Gate</div>
            <Stepper value={draft.gate_percent} onStep={stepGate} min={1} max={100} format={v => `${v}%`} width={50} />
          </div>
        </>
      )}

      {/* Sorties — pas d'entrée, contrairement à un Flux (le générateur EST la source) */}
      <div className="flux-editor-row">
        <div className="flux-editor-label">Sorties</div>
        <div className="port-buttons">
          {OUT_LABELS.map((lbl, i) => {
            const entry = draft.out.find(x => x.port === i);
            const on    = !!entry;
            return (
              <div key={i} className="port-btn-wrap">
                <button className={`port-btn${on ? ' on' : ''}`} onClick={() => toggleOut(i)}>{lbl}</button>
                {on ? (
                  <button
                    className={`chan-hint-btn${entry.chan_mask ? ' set' : ''}`}
                    onClick={() => openPicker(i)}
                    title="Choisir le(s) canal/canaux"
                  >
                    {entry.chan_mask ? chanMaskLabel(entry.chan_mask) : '?'}
                  </button>
                ) : (
                  <div className="chan-hint-spacer" />
                )}
              </div>
            );
          })}
        </div>
      </div>

      <div className="flux-editor-actions">
        <button
          className="btn primary"
          disabled={!valid}
          onClick={() => onSave(draft)}
        >
          Valider
        </button>
        <button className="btn" onClick={onCancel}>Annuler</button>
        {!valid && (
          <span style={{ fontSize: 12, color: '#9ca3af', alignSelf: 'center' }}>
            Sélectionnez au moins une sortie avec au moins un canal
          </span>
        )}
      </div>

      {picker && (
        <ChanPickerModal
          title={`Canaux — Sortie ${OUT_LABELS[picker.port]}`}
          initMask={pickerEntry ? pickerEntry.chan_mask : 0}
          allowAll={false}
          onConfirm={applyMask}
          onCancel={() => setPicker(null)}
        />
      )}
    </div>
  );
}

// ── DAT → MIDI utilities ─────────────────────────────────────────────────────

const DAT_SOURCE_NAMES = {0:'PC-DAW', 1:'Entree-A', 2:'Entree-B', 3:'USB-Host-C', 4:'USB-Host-D', 5:'USB-Host-E'};
const DAT_OUTPUT_NAMES = {1:'Sortie-1', 2:'Sortie-2', 3:'Sortie-3', 4:'Sortie-4', 5:'Sortie-5', 6:'Sortie-6', 7:'USB-Host-Out-1', 8:'USB-Host-Out-2', 9:'USB-Host-Out-3'};
const DAT_VALID_TYPES  = new Set([0x80, 0x90, 0xA0, 0xB0, 0xC0, 0xD0, 0xE0]);

function downloadBlob(data, filename) {
  const blob = new Blob([data], { type: 'audio/midi' });
  const url  = URL.createObjectURL(blob);
  const a    = Object.assign(document.createElement('a'), { href: url, download: filename });
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function encodeVarLen(n) {
  if (n === 0) return [0];
  const bytes = [];
  while (n > 0) { bytes.push(n & 0x7F); n >>>= 7; }
  bytes.reverse();
  for (let i = 0; i < bytes.length - 1; i++) bytes[i] |= 0x80;
  return bytes;
}

function parseDat(arrayBuffer) {
  const EVENT_SIZE = 10;
  const WRAP = 4294967296; // 2^32
  const view = new DataView(arrayBuffer);
  const count = Math.floor(view.byteLength / EVENT_SIZE);
  const events = [];
  let invalidRun = 0, tsOffset = 0, prevRawTs = 0;

  for (let i = 0; i < count; i++) {
    const off     = i * EVENT_SIZE;
    const rawTs   = view.getUint32(off, true);
    const output  = view.getUint8(off + 4);
    const source  = view.getUint8(off + 5);
    const type    = view.getUint8(off + 6);
    const channel = view.getUint8(off + 7);
    const d1      = view.getUint8(off + 8) & 0x7F;
    const d2      = view.getUint8(off + 9) & 0x7F;

    const typeNibble = type & 0xF0;
    if (!DAT_VALID_TYPES.has(typeNibble) || output < 1 || output > 9 || channel < 1 || channel > 16) {
      if (++invalidRun >= 32) break;
      continue;
    }
    invalidRun = 0;
    if (events.length > 0 && rawTs < prevRawTs - WRAP / 2) tsOffset += WRAP;
    prevRawTs = rawTs;
    events.push({ ts: rawTs + tsOffset, output, source, type: typeNibble, channel, d1, d2 });
  }

  if (events.length > 0) {
    const t0 = events[0].ts;
    for (const e of events) e.ts -= t0;
  }
  return events;
}

function buildTrackChunk(name, trackEvents, bpm, ppq) {
  const usPerTick = (60000000 / bpm) / ppq;
  const data = [];
  const nameBytes = Array.from(new TextEncoder().encode(name));
  data.push(0x00, 0xFF, 0x03, nameBytes.length, ...nameBytes);
  let prevTick = 0;
  for (const ev of trackEvents) {
    const tick  = Math.round(ev.ts / usPerTick);
    const delta = tick - prevTick;
    prevTick = tick;
    data.push(...encodeVarLen(delta));
    const status = ev.type | ((ev.channel - 1) & 0x0F);
    if (ev.type === 0xC0 || ev.type === 0xD0) data.push(status, ev.d1);
    else data.push(status, ev.d1, ev.d2);
  }
  data.push(0x00, 0xFF, 0x2F, 0x00);
  const chunk = new Uint8Array(8 + data.length);
  chunk[0]=0x4D; chunk[1]=0x54; chunk[2]=0x72; chunk[3]=0x6B; // MTrk
  const len = data.length;
  chunk[4]=(len>>24)&0xFF; chunk[5]=(len>>16)&0xFF; chunk[6]=(len>>8)&0xFF; chunk[7]=len&0xFF;
  chunk.set(data, 8);
  return chunk;
}

function buildTempoTrack(bpm) {
  const us = Math.round(60000000 / bpm);
  const data = [0x00,0xFF,0x51,0x03,(us>>16)&0xFF,(us>>8)&0xFF,us&0xFF,0x00,0xFF,0x2F,0x00];
  const chunk = new Uint8Array(8 + data.length);
  chunk[0]=0x4D; chunk[1]=0x54; chunk[2]=0x72; chunk[3]=0x6B;
  const len = data.length;
  chunk[4]=(len>>24)&0xFF; chunk[5]=(len>>16)&0xFF; chunk[6]=(len>>8)&0xFF; chunk[7]=len&0xFF;
  chunk.set(data, 8);
  return chunk;
}

function encodeMidi(events, { bpm = 120, ppq = 960, splitBy = 'output' } = {}) {
  const groups = new Map();
  for (const ev of events) {
    const key = splitBy === 'output' ? ev.output : ev.source;
    if (!groups.has(key)) groups.set(key, []);
    groups.get(key).push(ev);
  }
  const tracks = [buildTempoTrack(bpm)];
  for (const key of [...groups.keys()].sort((a,b) => a-b)) {
    const name = splitBy === 'output'
      ? (DAT_OUTPUT_NAMES[key] || `Sortie-${key}`)
      : (DAT_SOURCE_NAMES[key] || `Source-${key}`);
    tracks.push(buildTrackChunk(name, groups.get(key).sort((a,b) => a.ts - b.ts), bpm, ppq));
  }
  const numTracks = tracks.length;
  const header = new Uint8Array([
    0x4D,0x54,0x68,0x64, 0x00,0x00,0x00,0x06, // MThd length=6
    0x00,0x01,                                  // format 1
    (numTracks>>8)&0xFF, numTracks&0xFF,
    (ppq>>8)&0xFF, ppq&0xFF,
  ]);
  const totalLen = header.length + tracks.reduce((s,t) => s + t.length, 0);
  const out = new Uint8Array(totalLen);
  let off = 0;
  out.set(header, off); off += header.length;
  for (const t of tracks) { out.set(t, off); off += t.length; }
  return out;
}

// ── Firmware Section ─────────────────────────────────────────────────────────
function FirmwareSection({ send, connected, showToast }) {
  const [phase,           setPhase]           = useState('idle');
  const [fileInfo,        setFileInfo]        = useState(null);
  const [progress,        setProgress]        = useState(0);
  const [status,          setStatus]          = useState('');
  const [err,             setErr]             = useState('');
  const [sourceMode,      setSourceMode]      = useState('server');
  const [serverList,      setServerList]      = useState(null);
  const [serverError,     setServerError]     = useState('');
  const [selectedRelease, setSelectedRelease] = useState(null);
  const [fetchingHex,     setFetchingHex]     = useState(false);
  const fileRef = useRef(null);

  const serialOK = !!navigator.serial;

  useEffect(() => { fetchReleases(); }, []);

  async function fetchReleases() {
    setServerList('loading');
    setServerError('');
    if (window.location.protocol === 'file:') {
      setServerList('error');
      setServerError("index.html est ouvert en file:// — les requêtes réseau sont bloquées par le navigateur. Servez le dossier via un serveur HTTP local (ex : npx serve weblink) ou utilisez l'onglet Fichier local.");
      return;
    }
    try {
      const resp = await fetch(WEBLINK_BASE + 'firmwares/releases.json');
      if (!resp.ok) throw new Error(`HTTP ${resp.status} — ${resp.statusText} (${WEBLINK_BASE}firmwares/releases.json)`);
      const json = await resp.json();
      setServerList(Array.isArray(json) ? json : []);
    } catch(e) {
      setServerList('error');
      setServerError(e.message);
    }
  }

  async function handleServerSelect(release) {
    if (fetchingHex) return;
    setSelectedRelease(release);
    setErr('');
    setFetchingHex(true);
    try {
      const resp = await fetch(`${WEBLINK_BASE}firmwares/${release.filename}`);
      if (!resp.ok) throw new Error(`Fichier introuvable (HTTP ${resp.status})`);
      const text = await resp.text();
      const parsed = parseIntelHex(text);
      const binary = hexToBinary(parsed);
      setFileInfo({ name: release.filename, sizeKB: (binary.length / 1024).toFixed(1), binary });
      setPhase('parsed');
    } catch(e) {
      setErr(e.message);
      setSelectedRelease(null);
    } finally {
      setFetchingHex(false);
    }
  }

  function loadFile(file) {
    if (!file) return;
    if (!file.name.toLowerCase().endsWith('.hex')) {
      setErr("Le fichier doit avoir l'extension .hex");
      return;
    }
    const fr = new FileReader();
    fr.onload = ev => {
      try {
        const parsed = parseIntelHex(ev.target.result);
        const binary = hexToBinary(parsed);
        setFileInfo({ name: file.name, sizeKB: (binary.length / 1024).toFixed(1), binary });
        setPhase('parsed');
        setErr('');
      } catch(e) { setErr(e.message); }
    };
    fr.readAsText(file);
  }

  async function handleFlash() {
    if (!navigator.serial) {
      setErr('WebSerial non supporté — utilisez Chrome ou Edge récent.');
      return;
    }
    let port;
    try {
      setPhase('connecting');
      setErr('');
      port = await navigator.serial.requestPort({ filters: [{ usbVendorId: 0x16C0 }] });
    } catch(e) {
      setPhase('parsed');
      if (e.name !== 'NotFoundError') setErr(e.message);
      return;
    }
    setPhase('flashing');
    setProgress(0);
    setStatus('Connexion…');
    try {
      await otaFlash(port, fileInfo.binary, p => setProgress(p), s => setStatus(s));
      setPhase('done');
      showToast('Firmware mis à jour avec succès !', 'success');
    } catch(e) {
      setErr(e.message);
      setPhase('error');
    }
  }

  function reset() {
    setPhase('idle'); setFileInfo(null); setSelectedRelease(null);
    setProgress(0); setStatus(''); setErr('');
  }

  return (
    <>
      <div className="section-title">
        Mise à jour firmware
        <span className="badge">FIRMWARE</span>
      </div>

      {!serialOK && (
        <div className="warning-note">
          WebSerial non disponible. Utilisez <strong>Google Chrome</strong> ou <strong>Microsoft Edge</strong> récent.
        </div>
      )}

      {/* Onglets source — visibles uniquement en phase idle */}
      {phase === 'idle' && (
        <div className="fw-source-tabs">
          <button
            className={`fw-source-tab${sourceMode === 'server' ? ' active' : ''}`}
            onClick={() => {
              setSourceMode('server'); setErr('');
              if (!Array.isArray(serverList) && serverList !== 'loading') fetchReleases();
            }}
          >
            🌐 Firmwares du serveur
          </button>
          <button
            className={`fw-source-tab${sourceMode === 'local' ? ' active' : ''}`}
            onClick={() => { setSourceMode('local'); setErr(''); }}
          >
            📂 Fichier local
          </button>
        </div>
      )}

      {/* Panel principal */}
      <div className="panel">

        {/* ── Mode serveur, phase idle ── */}
        {phase === 'idle' && sourceMode === 'server' && (
          <>
            <p className="panel-hint">
              Sélectionnez une version dans la liste. Le fichier est téléchargé depuis le serveur puis transféré via WebSerial.
            </p>

            {serverList === 'loading' && (
              <div className="fw-status" style={{ padding: '8px 0' }}>⏳ Chargement de la liste…</div>
            )}

            {serverList === 'error' && (
              <div className="warning-note" style={{ marginBottom: 12 }}>
                Impossible de charger la liste des firmwares.
                {serverError && (
                  <div style={{ marginTop: 6, fontFamily: 'monospace', fontSize: 11, opacity: 0.85, wordBreak: 'break-word' }}>
                    {serverError}
                  </div>
                )}
                <br />
                <button className="btn-sm" style={{ marginTop: 8 }} onClick={fetchReleases}>Réessayer</button>
              </div>
            )}

            {Array.isArray(serverList) && serverList.length === 0 && (
              <div className="fw-status" style={{ padding: '8px 0', color: '#6b7280' }}>
                Aucun firmware disponible sur le serveur.
              </div>
            )}

            {Array.isArray(serverList) && serverList.length > 0 && (
              <div className="fw-release-list">
                {serverList.map(rel => {
                  const isSelected = selectedRelease?.filename === rel.filename;
                  const isLoading  = isSelected && fetchingHex;
                  return (
                    <div
                      key={rel.filename}
                      className={`fw-release-row${isSelected ? ' active' : ''}`}
                      onClick={() => handleServerSelect(rel)}
                      style={{ opacity: fetchingHex && !isSelected ? 0.5 : 1,
                               cursor: fetchingHex ? 'wait' : 'pointer' }}
                    >
                      <div className="fw-release-ver">{rel.version}</div>
                      <div className="fw-release-desc">{rel.description || rel.filename}</div>
                      <div className="fw-release-date">{rel.date}</div>
                      {isLoading && <span style={{ fontSize: 13, color: '#60a5fa', flexShrink: 0 }}>⏳</span>}
                    </div>
                  );
                })}
              </div>
            )}
          </>
        )}

        {/* ── Mode local, phase idle ── */}
        {phase === 'idle' && sourceMode === 'local' && (
          <>
            <p className="panel-hint">
              Compilez le sketch dans l'Arduino IDE (<strong>Croquis → Exporter le binaire compilé</strong>),
              puis sélectionnez le fichier <code>.hex</code> généré.
              Le miniMoc doit être branché via USB.
            </p>
            <div
              className="fw-zone"
              onClick={() => fileRef.current?.click()}
              onDragOver={e => { e.preventDefault(); e.currentTarget.classList.add('over'); }}
              onDragLeave={e => e.currentTarget.classList.remove('over')}
              onDrop={e => { e.preventDefault(); e.currentTarget.classList.remove('over'); loadFile(e.dataTransfer.files[0]); }}
            >
              <input ref={fileRef} type="file" accept=".hex" style={{ display:'none' }} onChange={e => loadFile(e.target.files[0])} />
              <div className="fw-zone-icon">📂</div>
              <div>Glissez un fichier <strong>.hex</strong> ici, ou cliquez pour sélectionner</div>
            </div>
          </>
        )}

        {/* ── Fichier sélectionné (phase ≠ idle) ── */}
        {phase !== 'idle' && fileInfo && (
          <div className="fw-file-info">
            <span style={{ fontSize: 22 }}>💾</span>
            <div style={{ flex: 1 }}>
              <div className="fw-info-name">{fileInfo.name}</div>
              <div className="fw-info-sub">
                {fileInfo.sizeKB} KB — prêt pour le transfert WebSerial
                {selectedRelease && ` · ${selectedRelease.version}`}
              </div>
            </div>
            {phase !== 'flashing' && phase !== 'connecting' && (
              <button className="btn" onClick={reset}>Changer</button>
            )}
          </div>
        )}

        {err && phase !== 'error' && <div className="warning-note" style={{ marginTop: 12 }}>{err}</div>}
      </div>

      {/* Panel flash — visible une fois un fichier sélectionné */}
      {fileInfo && phase !== 'idle' && (
        <div className="panel">

          {phase === 'parsed' && (
            <>
              <p className="panel-hint">
                Cliquez <strong>Mettre à jour</strong> puis sélectionnez le port série du miniMoc dans le sélecteur.
                Aucun redémarrage manuel requis — le transfert se fait directement via USB.
              </p>
              <button className="btn primary" onClick={handleFlash} disabled={!serialOK}>
                ⬆ Mettre à jour le firmware
              </button>
            </>
          )}

          {phase === 'connecting' && (
            <div className="fw-status" style={{ color: '#60a5fa', padding: '8px 0' }}>
              ⏳ Sélectionnez le port série du miniMoc dans le sélecteur Chrome…
            </div>
          )}

          {phase === 'flashing' && (
            <>
              <div className="fw-progress-track">
                <div className="fw-progress-fill" style={{ width: `${Math.round(progress * 100)}%` }} />
              </div>
              <div className="fw-status">{status} — {Math.round(progress * 100)}%</div>
            </>
          )}

          {phase === 'done' && (
            <div className="fw-status" style={{ color: '#10b981', padding: '8px 0' }}>
              ✓ Mise à jour terminée — le Teensy redémarre sur la nouvelle partition.
            </div>
          )}

          {phase === 'error' && (
            <>
              <div className="warning-note" style={{ marginBottom: 12 }}>{err}</div>
              <button className="btn" onClick={() => { setPhase('parsed'); setErr(''); }}>
                Réessayer
              </button>
            </>
          )}
        </div>
      )}
    </>
  );
}

// ── DAT → MIDI Section ───────────────────────────────────────────────────────
function DatToMidiSection({ showToast }) {
  const [datFile,    setDatFile]    = useState(null);   // { name, sizeKB, events }
  const [splitBy,    setSplitBy]    = useState('output');
  const [bpm,        setBpm]        = useState(120);
  const [avail,      setAvail]      = useState([]);     // [{key, name, count}]
  const [selected,   setSelected]   = useState(new Set());
  const [result,     setResult]     = useState(null);
  const [error,      setError]      = useState('');
  const fileRef = useRef(null);

  function computeTracks(events, split) {
    const counts = new Map();
    for (const ev of events) {
      const k = split === 'output' ? ev.output : ev.source;
      counts.set(k, (counts.get(k) || 0) + 1);
    }
    return [...counts.entries()]
      .sort(([a],[b]) => a - b)
      .map(([key, count]) => ({
        key,
        name: split === 'output'
          ? (DAT_OUTPUT_NAMES[key] || `Sortie-${key}`)
          : (DAT_SOURCE_NAMES[key] || `Source-${key}`),
        count,
      }));
  }

  function loadDat(file) {
    if (!file) return;
    if (!file.name.toLowerCase().endsWith('.dat')) {
      setError("Le fichier doit avoir l'extension .dat");
      return;
    }
    const fr = new FileReader();
    fr.onload = ev => {
      const events = parseDat(ev.target.result);
      const tracks = computeTracks(events, splitBy);
      setDatFile({ name: file.name, sizeKB: (ev.target.result.byteLength / 1024).toFixed(1), events });
      setAvail(tracks);
      setSelected(new Set(tracks.map(t => t.key)));
      setResult(null);
      setError('');
    };
    fr.readAsArrayBuffer(file);
  }

  function handleSplitChange(newSplit) {
    setSplitBy(newSplit);
    if (datFile) {
      const tracks = computeTracks(datFile.events, newSplit);
      setAvail(tracks);
      setSelected(new Set(tracks.map(t => t.key)));
      setResult(null);
    }
  }

  function toggleTrack(key) {
    setSelected(s => { const n = new Set(s); n.has(key) ? n.delete(key) : n.add(key); return n; });
  }

  function handleConvert() {
    try {
      const filtered = datFile.events.filter(ev => {
        const k = splitBy === 'output' ? ev.output : ev.source;
        return selected.has(k);
      });
