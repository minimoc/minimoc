      if (filtered.length === 0) {
        setError('Aucun événement dans les pistes sélectionnées.');
        return;
      }
      const midiData = encodeMidi(filtered, { bpm, splitBy });
      downloadBlob(midiData, datFile.name.replace(/\.dat$/i, '.mid'));
      const lastTs = filtered[filtered.length - 1].ts;
      setResult({ eventCount: filtered.length, trackCount: selected.size, durationSec: (lastTs / 1000000).toFixed(1) });
      showToast('Fichier MIDI téléchargé !', 'success');
      setError('');
    } catch(e) {
      setError(e.message);
    }
  }

  function reset() { setDatFile(null); setAvail([]); setSelected(new Set()); setResult(null); setError(''); }

  return (
    <>
      <div className="section-title">
        Convertisseur DAT → MIDI
        <span className="badge">DAT → MIDI</span>
      </div>

      {/* Fichier */}
      <div className="panel">
        <p className="panel-hint">
          Convertissez un enregistrement <code>.dat</code> du miniMoc en fichier MIDI standard (Type 1).
          Compatible avec tous les DAW. Aucune connexion requise.
        </p>
        {!datFile ? (
          <div
            className="fw-zone"
            onClick={() => fileRef.current?.click()}
            onDragOver={e => { e.preventDefault(); e.currentTarget.classList.add('over'); }}
            onDragLeave={e => e.currentTarget.classList.remove('over')}
            onDrop={e => { e.preventDefault(); e.currentTarget.classList.remove('over'); loadDat(e.dataTransfer.files[0]); }}
          >
            <input ref={fileRef} type="file" accept=".dat" style={{ display:'none' }} onChange={e => loadDat(e.target.files[0])} />
            <div className="fw-zone-icon">🎵</div>
            <div>Glissez un fichier <strong>.dat</strong> ici, ou cliquez pour sélectionner</div>
          </div>
        ) : (
          <div className="fw-file-info">
            <span style={{ fontSize: 22 }}>🎵</span>
            <div style={{ flex: 1 }}>
              <div className="fw-info-name">{datFile.name}</div>
              <div className="fw-info-sub">{datFile.events.length.toLocaleString()} événements · {datFile.sizeKB} KB</div>
            </div>
            <button className="btn" onClick={reset}>Changer</button>
          </div>
        )}
        {error && <div className="warning-note" style={{ marginTop: 12 }}>{error}</div>}
      </div>

      {/* Options + sélection des pistes */}
      {datFile && (
        <div className="panel">
          <p className="panel-hint" style={{ marginBottom: 14 }}>Options de conversion</p>

          <div style={{ display: 'flex', gap: 24, flexWrap: 'wrap', alignItems: 'center', marginBottom: 18 }}>
            <label style={{ display: 'flex', alignItems: 'center', gap: 8, fontSize: 14 }}>
              BPM
              <input
                type="number" min="20" max="300" step="1"
                value={bpm}
                onChange={e => setBpm(Math.max(20, Math.min(300, +e.target.value || 120)))}
                style={{ width: 70, background: '#111827', border: '1px solid #374151', color: '#f9fafb', borderRadius: 6, padding: '4px 8px', fontSize: 14 }}
              />
            </label>
            <label style={{ display: 'flex', alignItems: 'center', gap: 8, fontSize: 14 }}>
              Grouper par
              <select
                value={splitBy}
                onChange={e => handleSplitChange(e.target.value)}
                className="midi-select"
                style={{ maxWidth: 180 }}
              >
                <option value="output">Sortie (1–9)</option>
                <option value="source">Entrée (A–E)</option>
              </select>
            </label>
          </div>

          {/* Sélection individuelle des pistes */}
          <div style={{ marginBottom: 18 }}>
            <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 8 }}>
              <span style={{ fontSize: 13, color: '#9ca3af' }}>
                Pistes ({selected.size}/{avail.length} sélectionnées)
              </span>
              <span style={{ display: 'flex', gap: 6 }}>
                <button className="btn-sm" onClick={() => setSelected(new Set(avail.map(t => t.key)))}>Tout</button>
                <button className="btn-sm" onClick={() => setSelected(new Set())}>Aucun</button>
              </span>
            </div>
            <div style={{ display: 'flex', flexWrap: 'wrap', gap: 6 }}>
              {avail.map(t => {
                const on = selected.has(t.key);
                return (
                  <div
                    key={t.key}
                    onClick={() => toggleTrack(t.key)}
                    style={{
                      display: 'flex', alignItems: 'center', gap: 6,
                      fontSize: 13, cursor: 'pointer', userSelect: 'none',
                      background: on ? '#10b98118' : '#111827',
                      border: `1px solid ${on ? '#10b981' : '#374151'}`,
                      borderRadius: 6, padding: '4px 10px',
                      color: on ? '#f9fafb' : '#6b7280',
                      transition: 'all 0.12s',
                    }}
                  >
                    <span style={{ fontSize: 10, color: on ? '#10b981' : '#4b5563' }}>{on ? '■' : '□'}</span>
                    {t.name}
                    <span style={{ fontSize: 11, color: '#6b7280' }}>({t.count})</span>
                  </div>
                );
              })}
            </div>
          </div>

          <button className="btn primary" onClick={handleConvert} disabled={selected.size === 0}>
            ⬇ Convertir et télécharger le .mid
          </button>
          {result && (
            <div style={{ marginTop: 14, fontSize: 13, color: '#9ca3af' }}>
              ✓ {result.eventCount.toLocaleString()} événements · {result.trackCount} piste{result.trackCount > 1 ? 's' : ''} · {result.durationSec} s
            </div>
          )}
        </div>
      )}
    </>
  );
}

// ── Toast ────────────────────────────────────────────────────────────────────
function Toast({ message, type, onDone }) {
  useEffect(() => {
    const t = setTimeout(onDone, 2400);
    return () => clearTimeout(t);
  }, []);
  return <div className={`toast ${type}`}>{message}</div>;
}

// ── Main App ─────────────────────────────────────────────────────────────────
function App() {
  // MIDI
  const [midiSupported, setMidiSupported] = useState(true);
  const [midiAccess,    setMidiAccess]    = useState(null);
  const [inputPorts,    setInputPorts]    = useState([]);   // [{id, name}]
  const [selectedPort,  setSelectedPort]  = useState('');
  const [connected,     setConnected]     = useState(false);
  const inputRef      = useRef(null);
  const outputRef     = useRef(null);
  const heartbeatRef  = useRef(null);
  const lastPongRef   = useRef(0);      // timestamp du dernier pong reçu
  const PONG_TIMEOUT  = 1500;           // ms sans pong → déconnecté

  // Device state
  const [dev,   setDev]   = useState(makeDefaultState);
  const [dirty, setDirty] = useState(false);

  // État Play/Pause purement local (le firmware ne renvoie pas encore cet
  // état par SysEx) — bascule de façon optimiste à chaque clic/action, peut
  // dériver si l'état est changé ailleurs (écran TRANSPORT physique).
  const [transportPlaying, setTransportPlaying] = useState(false);

  // UI
  const [section,     setSection]     = useState('sync');
  const [showEditor,  setShowEditor]  = useState(false);
  const [editingIdx,  setEditingIdx]  = useState(null);
  const [showGenEditor, setShowGenEditor] = useState(false);
  const [editingGenIdx, setEditingGenIdx] = useState(null);
  const [toast,       setToast]       = useState(null);
  const [presetModal, setPresetModal] = useState(null); // {mode:'load'|'save', selected:n}

  // Compatibilité weblink ↔ firmware
  const [versionsManifest, setVersionsManifest] = useState(null);
  const [compatWarning,    setCompatWarning]    = useState(null);
  const [versionTimedOut,  setVersionTimedOut]  = useState(false);
  const firmwareVersionRef = useRef('');   // miroir de dev.firmwareVersion, lu dans le timeout ci-dessous
  const VERSION_TIMEOUT_MS = 2500;

  useEffect(() => {
    fetch(WEBLINK_BASE + 'versions.json')
      .then(r => r.ok ? r.json() : null)
      .then(setVersionsManifest)
      .catch(() => setVersionsManifest(null));
  }, []);

  useEffect(() => { firmwareVersionRef.current = dev.firmwareVersion; }, [dev.firmwareVersion]);

  // À chaque déconnexion (y compris pendant un reboot après flash OTA), on
  // oublie la version affichée : sinon le badge/l'état de compatibilité
  // resteraient basés sur l'ancien firmware pendant toute la reconnexion,
  // au lieu de repartir à zéro pour le nouveau.
  useEffect(() => {
    if (!connected) {
      setDev(prev => (prev.firmwareVersion ? { ...prev, firmwareVersion: '' } : prev));
    }
  }, [connected]);

  // Les firmwares publiés avant l'ajout de la commande 0x03 (≤ v0.2.2b) ne
  // répondent jamais à la demande de version — on ne peut pas les détecter
  // par comparaison, seulement par absence de réponse après un délai.
  useEffect(() => {
    if (!connected) { setVersionTimedOut(false); return; }
    setVersionTimedOut(false);
    const t = setTimeout(() => {
      if (!firmwareVersionRef.current) setVersionTimedOut(true);
    }, VERSION_TIMEOUT_MS);
    return () => clearTimeout(t);
  }, [connected]);

  // Détermine quelle version du configurateur (current ou une entrée de
  // l'archive) convient à un firmware donné. Retourne null si le manifest
  // ne permet pas de trancher (pas encore chargé, ou firmware inconnu).
  // path=null signifie "current" (la racine weblink/, pas une archive).
  function _recommendedFor(firmwareVersion, manifest) {
    if (!manifest || !manifest.current) return null;
    const cmp = compareVersions(firmwareVersion, manifest.current.min_firmware);
    if (cmp === null) return null;   // firmware inconnu : impossible de comparer
    if (cmp >= 0) return { version: manifest.current.weblink_version, path: null };
    const match = (manifest.archive || []).find(
      a => compareVersions(firmwareVersion, a.max_firmware) <= 0
    );
    return match ? { version: match.weblink_version, path: match.path } : { version: null, path: null };
  }

  useEffect(() => {
    if (!versionsManifest) { setCompatWarning(null); return; }

    if (versionTimedOut && !dev.firmwareVersion) {
      // Pas de réponse à la demande de version : probablement un firmware
      // antérieur à la commande 0x03. On propose l'archive la plus ancienne
      // connue faute de pouvoir identifier la version exacte — sauf si
      // cette page EST déjà cette archive-là (rien à recommander alors).
      const fallback = (versionsManifest.archive || [])[0];
      if (!fallback || fallback.weblink_version === WEBLINK_VERSION) {
        setCompatWarning(null);
      } else {
        setCompatWarning({ firmwareVersion: null, path: fallback.path, hasRecommendation: true });
      }
      return;
    }

    if (!dev.firmwareVersion) { setCompatWarning(null); return; }

    // Compare la version RECOMMANDÉE pour ce firmware à la version de CETTE
    // page (WEBLINK_VERSION), pas au `current` du manifest — sinon une
    // archive parfaitement compatible avec son propre firmware cible se
    // signale à tort comme obsolète dès que `current` avance.
    const rec = _recommendedFor(dev.firmwareVersion, versionsManifest);
    if (!rec || rec.version === WEBLINK_VERSION) {
      setCompatWarning(null);
      return;
    }
    // rec.path === null signifie "current" (racine weblink/) ; rec.version
    // === null signifie qu'aucune version compatible n'est connue du tout.
    setCompatWarning({ firmwareVersion: dev.firmwareVersion, path: rec.path, hasRecommendation: rec.version !== null });
  }, [dev.firmwareVersion, versionsManifest, versionTimedOut]);

  // ── send ──
  function send(body) {
    if (!outputRef.current) return;
    try { outputRef.current.send(sysexMsg(body)); }
    catch (e) { console.warn('MIDI send error', e); }
  }

  function showToast(msg, type = 'success') {
    setToast({ msg, type, key: Date.now() });
  }

  // ── SysEx parser ──
  function parseSysex(bytes) {
    if (bytes[0] !== 0xF0 || bytes[1] !== MANUFACTURER_ID || bytes[bytes.length - 1] !== 0xF7) return;
    const cmd  = bytes[2];
    const body = bytes.slice(3, bytes.length - 1);

    // Tout message valide reçu = device vivant
    lastPongRef.current = Date.now();
    setConnected(true);

    // Le pong 0x08 ne modifie pas le state — juste le timestamp ci-dessus
    if (cmd === 0x08) return;

    setDev(prev => {
      switch (cmd) {
        case 0x07: // preset
          return { ...prev, preset: body[0] };

        case 0x09: { // basic matrix cell
          const [inIdx, outIdx, val] = body;
          if (inIdx >= N_IN || outIdx >= N_OUT) return prev;
          const mat = [...prev.basicMatrix];
          if (val) mat[inIdx] |=  (1 << outIdx);
          else     mat[inIdx] &= ~(1 << outIdx);
          return { ...prev, basicMatrix: mat };
        }

        case 0x0B: { // flux count — tronque à la nouvelle longueur, sans tout effacer
          // Le heartbeat (toutes les 500ms) redemande systématiquement ce
          // count puis chaque flux (0x0A) l'un après l'autre — repartir de
          // [] à chaque fois ferait clignoter la liste (0 → 1 → 2 → ... item
          // à chaque poll). Tant que le nombre de flux n'a pas changé, les
          // lignes existantes restent montées (même clé), juste mises à jour
          // en place par les 0x0A qui suivent — pas de flicker visible.
          const n = body[0];
          return { ...prev, fluxes: prev.fluxes.slice(0, n) };
        }

        case 0x0A: { // flux data
          let ptr = 0;
          const idx    = body[ptr++];
          const n_in   = body[ptr++];
          const n_out  = body[ptr++];
          const active = body[ptr++] !== 0;
          // TransformType : 0=aucun 1=transpose 2=harmonize 3=chord harmonize (cf. PCEditor.h)
          const type        = body[ptr++];
          const transpose   = body[ptr++] - 64; // biaisé +64 côté firmware
          const n_intervals = body[ptr++];
          const intervals = [];
          for (let i = 0; i < 4; i++) intervals.push(body[ptr++] - 64);
          for (let i = n_intervals; i < 4; i++) intervals[i] = 0;   // slots au-delà de n_intervals : inutilisés
          // root_key/progression_id/bars_per_chord : présents seulement si le firmware
          // connecté a été mis à jour pour le format étendu — sinon défauts sûrs.
          let root_key, progression_id, bars_per_chord;
          if (ptr + 3 <= body.length) {
            root_key       = body[ptr++];
            progression_id = body[ptr++];
            bars_per_chord = body[ptr++];
          } else {
            root_key = 0; progression_id = 0; bars_per_chord = CHORD_BARS_DEFAULT;
          }
          // chan_mask : 3 octets 7-bit → bits 0-6 | bits 7-13 | bits 14-15
          const ins = [];
          for (let i = 0; i < n_in;  i++) {
            const port = body[ptr++];
            const lo   = body[ptr++];
            const mid  = body[ptr++];
            const top  = body[ptr++];
            ins.push({ port, chan_mask: lo | (mid << 7) | (top << 14) });
          }
          const outs = [];
          for (let i = 0; i < n_out; i++) {
            const port = body[ptr++];
            const lo   = body[ptr++];
            const mid  = body[ptr++];
            const top  = body[ptr++];
            outs.push({ port, chan_mask: lo | (mid << 7) | (top << 14) });
          }
          const fluxes = [...prev.fluxes];
          fluxes[idx] = { in: ins, out: outs, active, transform: { type, transpose, intervals, root_key, progression_id, bars_per_chord } };
          return { ...prev, fluxes };
        }

        case 0x13: { // générateur count — tronque à la nouvelle longueur, sans tout effacer (même raison que 0x0B ci-dessus)
          const n = body[0];
          return { ...prev, generators: prev.generators.slice(0, n) };
        }

        case 0x12: { // générateur data
          let ptr = 0;
          const idx             = body[ptr++];
          const type             = body[ptr++];
          const active           = body[ptr++] !== 0;
          const waveform         = body[ptr++];
          const sync_mode        = body[ptr++];
          const rateLo = body[ptr++], rateHi = body[ptr++];
          const rate_x10hz       = rateLo | (rateHi << 7);   // 14 bits (2 octets 7-bit, comme le BPM)
          const division_idx     = body[ptr++];
          const depth             = body[ptr++];
          const center            = body[ptr++];
          const cc_number         = body[ptr++];
          const note              = body[ptr++];
          const euclid_steps      = body[ptr++];
          const euclid_pulses     = body[ptr++];
          const euclid_rotation   = body[ptr++];
          const gate_percent      = body[ptr++];
          const n_out             = body[ptr++];
          // chan_mask : 3 octets 7-bit → bits 0-6 | bits 7-13 | bits 14-15
          const outs = [];
          for (let i = 0; i < n_out; i++) {
            const port = body[ptr++];
            const lo   = body[ptr++];
            const mid  = body[ptr++];
            const top  = body[ptr++];
            outs.push({ port, chan_mask: lo | (mid << 7) | (top << 14) });
          }
          // pattern_id (v9) : octet optionnel en fin de message — absent si
          // connecté à un firmware antérieur au type PATTERN, défaut 0.
          const pattern_id = ptr < body.length ? body[ptr++] : 0;
          const generators = [...(prev.generators || [])];
          generators[idx] = { type, active, waveform, sync_mode, rate_x10hz, division_idx, depth, center, cc_number, note, euclid_steps, euclid_pulses, euclid_rotation, gate_percent, pattern_id, out: outs };
          return { ...prev, generators };
        }

        case 0x0C: // sync master
          return { ...prev, syncMaster: body[0] };

        case 0x03: // version firmware — ASCII (ex. "v0.3.0")
          return { ...prev, firmwareVersion: String.fromCharCode(...Array.from(body)) };

        case 0x04: // BPM horloge interne MINIMOC — 14 bits (2 octets 7-bit)
          return { ...prev, internalBpm: body[0] | (body[1] << 7) };

        case 0x0D: // host config — 0x7F sur le fil = aucun slot (HC_NO_SLOT)
          return {
            ...prev,
            hostMode: body[0],
            portSlot: Array.from(body.slice(1, 7)).map(v => v >= 6 ? 0x7F : v),
          };

        case 0x0F: { // nom device USB — F0 7D 0F slotIdx nameChars... F7
          const slotIdx = body[0];
          if (slotIdx >= 6) return prev;
          const name = String.fromCharCode(...Array.from(body.slice(1)));
          const deviceNames = [...(prev.deviceNames || ['','','','','',''])];
          deviceNames[slotIdx] = name;
          return { ...prev, deviceNames };
        }

        default: return prev;
      }
    });
  }

  // ── MIDI init ──
  useEffect(() => {
    if (!navigator.requestMIDIAccess) { setMidiSupported(false); return; }
    navigator.requestMIDIAccess({ sysex: true })
      .then(access => {
        setMidiAccess(access);
        refreshPorts(access);
        access.onstatechange = () => refreshPorts(access);
      })
      .catch(() => setMidiSupported(false));
  }, []);

  function refreshPorts(access) {
    const list = [];
    access.inputs.forEach(p => list.push({ id: p.id, name: p.name }));
    setInputPorts(list);
    // Auto-select miniMoc
    const moc = list.find(p => p.name.toUpperCase().includes('MINIMOC'));
    if (moc) setSelectedPort(prev => prev || moc.id);
  }

  // ── Connect / disconnect ──
  useEffect(() => {
    if (heartbeatRef.current) { clearInterval(heartbeatRef.current); heartbeatRef.current = null; }
    if (inputRef.current)     { inputRef.current.onmidimessage = null; inputRef.current = null; }
    outputRef.current = null;
    setConnected(false);

    if (!midiAccess || !selectedPort) return;

    const inPort = midiAccess.inputs.get(selectedPort);
    if (!inPort) return;

    // Match output by name
    let outPort = null;
    midiAccess.outputs.forEach(p => { if (p.name === inPort.name) outPort = p; });
    if (!outPort) return;

    inputRef.current  = inPort;
    outputRef.current = outPort;
    lastPongRef.current = 0;   // reset : pas encore de réponse

    inPort.onmidimessage = e => {
      if (e.data[0] === 0xF0) parseSysex(e.data);
    };

    // NE PAS setConnected(true) ici — on attend le premier pong

    // Request full dump after short delay
    const dumpTimer = setTimeout(() => {
      if (outputRef.current) outputRef.current.send(sysexMsg([MANUFACTURER_ID, 0x02]));
    }, 300);

    // Heartbeat + quick poll toutes les 500ms
    // La connexion devient vraie seulement quand un message est reçu
    // Si aucun pong depuis PONG_TIMEOUT → déconnecté
    heartbeatRef.current = setInterval(() => {
      try {
        if (!outputRef.current) return;
        outputRef.current.send(sysexMsg([MANUFACTURER_ID, 0x08]));
        outputRef.current.send(sysexMsg([MANUFACTURER_ID, 0x0E]));
        // Vérifier le timeout : si on a déjà eu un pong mais plus rien depuis PONG_TIMEOUT
        if (lastPongRef.current > 0 && Date.now() - lastPongRef.current > PONG_TIMEOUT) {
          setConnected(false);
        }
      } catch (_) {
        setConnected(false);
      }
    }, 500);

    return () => {
      clearTimeout(dumpTimer);
      clearInterval(heartbeatRef.current);
      if (inputRef.current) inputRef.current.onmidimessage = null;
    };
  }, [midiAccess, selectedPort]);

  // ── Actions ──────────────────────────────────────────────────────────────
  function doSync() {
    if (!outputRef.current) return;
    outputRef.current.send(sysexMsg([MANUFACTURER_ID, 0x02]));
    setDirty(false);
    showToast('Synchronisation demandée', 'info');
  }

  function applyFactory(tpl) {
    if (dirty && !window.confirm(`Appliquer "${tpl.name}" ? Les modifications non sauvegardées seront perdues.`)) return;
    // Supprimer tous les flux existants (ordre décroissant)
    for (let i = dev.fluxes.length - 1; i >= 0; i--) {
      send([MANUFACTURER_ID, 0x0B, i]);
    }
    // Supprimer tous les générateurs existants (même logique que apply_factory() côté firmware, logic.h)
    for (let i = dev.generators.length - 1; i >= 0; i--) {
      send([MANUFACTURER_ID, 0x13, i]);
    }
    // Appliquer la basic_matrix via 0x09
    for (let inIdx = 0; inIdx < 5; inIdx++) {
      for (let outIdx = 0; outIdx < 9; outIdx++) {
        const val = (tpl.matrix[inIdx] >> outIdx) & 1;
        send([MANUFACTURER_ID, 0x09, inIdx, outIdx, val]);
      }
    }
    setDev(prev => ({ ...prev, basicMatrix: [...tpl.matrix], fluxes: [], generators: [] }));
    setDirty(true);
    setPresetModal(null);
    showToast(`Template "${tpl.name}" appliqué`);
  }

  function doLoad() {
    setPresetModal({ mode: 'load', selected: dev.preset });
  }

  function doSave() {
    setPresetModal({ mode: 'save', selected: dev.preset });
  }

  function confirmPresetModal() {
    if (!presetModal) return;
    const { mode, selected } = presetModal;
    if (mode === 'load') {
      send([MANUFACTURER_ID, 0x05, selected]);
      setDirty(false);
      showToast(`Preset ${selected} chargé`);
    } else {
      send([MANUFACTURER_ID, 0x06, selected]);
      setDirty(false);
      showToast(`Preset ${selected} sauvegardé`);
    }
    setPresetModal(null);
  }

  function setSync(val) {
    setDev(prev => ({ ...prev, syncMaster: val }));
    send([MANUFACTURER_ID, 0x0C, val]);
    setDirty(true);
  }

  function setInternalBpm(val) {
    const clamped = Math.max(20, Math.min(300, val));
    setDev(prev => ({ ...prev, internalBpm: clamped }));
    send([MANUFACTURER_ID, 0x04, clamped & 0x7F, (clamped >> 7) & 0x7F]);
    setDirty(true);
  }

  // Utilise la forme fonctionnelle de setDev (lit "prev", pas "dev" via la
  // closure) — indispensable pour un appui maintenu : setInterval capture la
  // fonction une seule fois, donc lire "dev.internalBpm" directement renverrait
  // toujours la même valeur figée au lieu d'accumuler les pas.
  function nudgeInternalBpm(delta) {
    setDev(prev => {
      const clamped = Math.max(20, Math.min(300, prev.internalBpm + delta));
      send([MANUFACTURER_ID, 0x04, clamped & 0x7F, (clamped >> 7) & 0x7F]);
      return { ...prev, internalBpm: clamped };
    });
    setDirty(true);
  }

  // ── Appui maintenu sur +/- BPM : hook partagé avec tous les autres steppers
  // de l'appli (transpose, harmonize, générateurs...) — voir useHoldRepeat().
  const bpmHold = useHoldRepeat();
  function startBpmHold(delta) { bpmHold.start(() => nudgeInternalBpm(delta)); }
  const stopBpmHold = bpmHold.stop;

  // ACTION : 0=Play/Pause 1=Stop 2=Record 3=Fast Forward 4=Rewind (cf. PCEditor.h case 0x11)
  function sendTransportAction(action) {
    send([MANUFACTURER_ID, 0x11, action]);
    if (action === TRANSPORT_ACTION.PLAY_PAUSE) {
      setTransportPlaying(p => !p);
    } else if (action === TRANSPORT_ACTION.STOP) {
      setTransportPlaying(false);
    }
  }

  function toggleMatrix(inIdx, outIdx) {
    setDev(prev => {
      const mat = [...prev.basicMatrix];
      const was = (mat[inIdx] >> outIdx) & 1;
      const val = was ? 0 : 1;
      if (val) mat[inIdx] |=  (1 << outIdx);
      else     mat[inIdx] &= ~(1 << outIdx);
      send([MANUFACTURER_ID, 0x09, inIdx, outIdx, val]);
      setDirty(true);
      return { ...prev, basicMatrix: mat };
    });
  }

  function handleFluxSave(flux) {
    const idx = editingIdx !== null ? editingIdx : dev.fluxes.length;
    const nf  = { ...flux, in: [...flux.in], out: [...flux.out] };
    setDev(prev => {
      const fluxes = [...prev.fluxes];
      fluxes[idx]  = nf;
      return { ...prev, fluxes };
    });
    outputRef.current && outputRef.current.send(encodeFluxMsg(idx, nf));
    setDirty(true);
    setShowEditor(false);
    setEditingIdx(null);
    showToast(`Flux F${idx + 1} sauvegardé`);
  }

  function deleteFlux(idx) {
    if (!confirm(`Supprimer le flux F${idx + 1} ?`)) return;
    send([MANUFACTURER_ID, 0x0B, idx]);
    setDev(prev => {
      const fluxes = prev.fluxes.filter((_, i) => i !== idx);
      return { ...prev, fluxes };
    });
    setDirty(true);
    showToast(`Flux F${idx + 1} supprimé`, 'info');
  }

  function handleGeneratorSave(gen) {
    const idx = editingGenIdx !== null ? editingGenIdx : dev.generators.length;
    const ng  = { ...gen, out: [...gen.out] };
    setDev(prev => {
      const generators = [...prev.generators];
      generators[idx]  = ng;
      return { ...prev, generators };
    });
    outputRef.current && outputRef.current.send(encodeGeneratorMsg(idx, ng));
    setDirty(true);
    setShowGenEditor(false);
    setEditingGenIdx(null);
    showToast(`Générateur L${idx + 1} sauvegardé`);
  }

  function deleteGenerator(idx) {
    if (!confirm(`Supprimer le générateur L${idx + 1} ?`)) return;
    send([MANUFACTURER_ID, 0x13, idx]);
    setDev(prev => {
      const generators = prev.generators.filter((_, i) => i !== idx);
      return { ...prev, generators };
    });
    setDirty(true);
    showToast(`Générateur L${idx + 1} supprimé`, 'info');
  }

  function setHostMode(mode) {
    setDev(prev => {
      const next = { ...prev, hostMode: mode };
      send([MANUFACTURER_ID, 0x0D, mode, ...next.portSlot]);
      setDirty(true);
      return next;
    });
  }

  function setPortSlot(slotIdx, val) {
    setDev(prev => {
      const portSlot = [...prev.portSlot];
      portSlot[slotIdx] = val;
      send([MANUFACTURER_ID, 0x0D, prev.hostMode, ...portSlot]);
      setDirty(true);
      return { ...prev, portSlot };
    });
  }

  // ── Render ────────────────────────────────────────────────────────────────
  const isConnected = connected && !!outputRef.current;

  return (
    <>
      {/* HEADER */}
      <header className="header">
        <div className="logo">mini<span>Moc</span></div>
        {isConnected && dev.firmwareVersion && (
          <span className="fw-version-badge" title="Version du firmware connecté">
            {dev.firmwareVersion}
          </span>
        )}
        <div className="header-sep" />

        <select
          className="midi-select"
          value={selectedPort}
          onChange={e => setSelectedPort(e.target.value)}
        >
          <option value="">— Port MIDI —</option>
          {inputPorts.map(p => (
            <option key={p.id} value={p.id}>{p.name}</option>
          ))}
        </select>

        <div className={`conn-dot ${isConnected ? 'connected' : 'disconnected'}`} />
        <span className="conn-label">{isConnected ? 'Connecté' : 'Déconnecté'}</span>

        <div className="spacer" />

        <div className="preset-area">
          <span className="preset-label">Preset</span>
          <span className="preset-num">
            {dev.preset}{dirty && <span className="dirty-star"> *</span>}
          </span>
          <button className="btn" disabled={!isConnected} onClick={doLoad}>Charger</button>
          <button className="btn amber" disabled={!isConnected} onClick={doSave}>Sauver</button>
        </div>
      </header>

      {compatWarning && (
        <div className="compat-banner">
          {compatWarning.firmwareVersion ? (
            <>⚠️ Ce firmware ({compatWarning.firmwareVersion}) n'est pas compatible avec ce configurateur (v{WEBLINK_VERSION}).{' '}</>
          ) : (
            <>⚠️ Cet appareil n'a pas répondu à la demande de version — il s'agit probablement d'un firmware
            antérieur à v0.3.0 (avant l'ajout de cette commande), incompatible avec ce configurateur (v{WEBLINK_VERSION}).{' '}</>
          )}
          {compatWarning.hasRecommendation ? (
            <>Utilisez la <a href={WEBLINK_BASE + (compatWarning.path || '')} target="_blank" rel="noreferrer">version compatible du configurateur</a>.</>
          ) : (
            <>Aucune version compatible connue — certaines fonctions peuvent ne pas marcher.</>
          )}
        </div>
      )}

      <div className="app-body">
        {/* SIDEBAR */}
        <nav className="sidebar">
          {[
            { id: 'sync',   icon: '⟳', label: 'SYNC'        },
            { id: 'matrix', icon: '⊞', label: 'MATRICE'      },
            { id: 'flux',   icon: '⇄', label: 'FLUX'         },
            { id: 'generateurs', icon: '∿', label: 'GENERATEURS' },
            { id: 'host',     icon: '⚙', label: 'HOST CONFIG'  },
            { id: 'firmware', icon: '⬆', label: 'FIRMWARE'     },
            ...(DAT2MIDI_ENABLED ? [{ id: 'dat2midi', icon: '♪', label: 'DAT → MIDI' }] : []),
          ].map(item => (
            <div
              key={item.id}
              className={`nav-link${section === item.id ? ' active' : ''}`}
              onClick={() => setSection(item.id)}
            >
              <span className="nav-icon">{item.icon}</span>
              {item.label}
            </div>
          ))}

          {/* Filet de sécurité, indépendant de la détection auto de compatibilité :
              toujours accessible même si le firmware ne répond pas à la requête
              de version (anciens firmwares ne connaissent pas la commande 0x03). */}
          <div className="sidebar-footer-link">
            v{WEBLINK_VERSION}
            {versionsManifest && versionsManifest.archive && versionsManifest.archive.filter(a => a.weblink_version !== WEBLINK_VERSION).length > 0 && (
              <> — {versionsManifest.archive.filter(a => a.weblink_version !== WEBLINK_VERSION).map((a, i) => (
                <React.Fragment key={a.path}>
                  {i > 0 && ' · '}
                  <a href={WEBLINK_BASE + a.path} target="_blank" rel="noreferrer" title={a.description}>v{a.weblink_version}</a>
                </React.Fragment>
              ))}</>
            )}
          </div>
        </nav>

        {/* MAIN */}
        <main className="main-content">

          {/* ── No Web MIDI support ── */}
          {!midiSupported && (
            <div className="no-midi">
              <div className="icon">🚫</div>
              <h2>Web MIDI non supporté</h2>
              <p>Ce navigateur ne supporte pas le Web MIDI API avec SysEx. Utilisez <strong>Google Chrome</strong> ou <strong>Microsoft Edge</strong>. Firefox ne supporte pas SysEx.</p>
            </div>
          )}

          {/* ── Not connected ── */}
          {midiSupported && !isConnected && section !== 'firmware' && section !== 'dat2midi' && (
            <div className="no-midi">
              <div className="icon">🎛</div>
              <h2>Brancher le miniMoc via USB</h2>
              <p>
                Connectez votre miniMoc via USB, puis sélectionnez le port MIDI dans la liste ci-dessus.
                La page doit être ouverte en <strong>HTTPS</strong> ou depuis <strong>localhost</strong> pour accéder au Web MIDI API.
              </p>
            </div>
          )}

          {/* ── Connected UI ── */}
          {midiSupported && isConnected && (
            <>
              {/* ═══ SYNC ═══ */}
              {section === 'sync' && (
                <>
                  <div className="section-title">
                    Maître de synchronisation
                    <span className="badge">SYNC</span>
                  </div>
                  <div className="panel">
                    <p className="panel-hint">
                      Le port sélectionné transmet son clock MIDI à tous les autres ports. Choisissez OFF pour désactiver le routage du clock.
                    </p>
                    <div className="sync-grid">
                      {SYNC_LABELS.map((lbl, i) => {
                        const val      = i < 11 ? i : 0x7F;
                        const isActive = dev.syncMaster === val;
                        return (
                          <div
                            key={lbl}
                            className={`sync-box${isActive ? ' active' : ''}`}
                            onClick={() => setSync(val)}
                          >
                            {lbl}
                          </div>
                        );
                      })}
                    </div>

                    <div className="bpm-control">
                      <label htmlFor="internal-bpm">
                        Tempo de l'horloge interne MINIMOC
                      </label>
                      <div className="bpm-row">
                        <button
                          className="bpm-btn"
                          onMouseDown={() => startBpmHold(-1)}
                          onMouseUp={stopBpmHold}
                          onMouseLeave={stopBpmHold}
                          onTouchStart={e => { e.preventDefault(); startBpmHold(-1); }}
                          onTouchEnd={stopBpmHold}
                        >−</button>
                        <span id="internal-bpm" className="bpm-value">{dev.internalBpm} BPM</span>
                        <button
                          className="bpm-btn"
                          onMouseDown={() => startBpmHold(1)}
                          onMouseUp={stopBpmHold}
                          onMouseLeave={stopBpmHold}
                          onTouchStart={e => { e.preventDefault(); startBpmHold(1); }}
                          onTouchEnd={stopBpmHold}
                        >+</button>
                      </div>
                      <p className="panel-hint">
                        N'a d'effet que lorsque MINIMOC est sélectionné comme maître ci-dessus.
                      </p>
                    </div>
                  </div>

                  <div className="panel">
                    <p className="panel-hint">
                      Boutons de transport de l'horloge interne MINIMOC (identiques aux gestes
                      de l'écran TRANSPORT sur l'appareil).
                    </p>
                    <div className="transport-row">
                      <button
                        className={`transport-btn${transportPlaying ? ' active' : ''}`}
                        title={transportPlaying ? 'Pause' : 'Play'}
                        onClick={() => sendTransportAction(TRANSPORT_ACTION.PLAY_PAUSE)}
                      >
                        {transportPlaying ? '⏸' : '▶'}
                      </button>
                      <button className="transport-btn" title="Stop" onClick={() => sendTransportAction(TRANSPORT_ACTION.STOP)}>⏹</button>
                      <button className="transport-btn" title="Record" onClick={() => sendTransportAction(TRANSPORT_ACTION.RECORD)}>⏺</button>
                      <button className="transport-btn" title="Rewind" onClick={() => sendTransportAction(TRANSPORT_ACTION.REWIND)}>⏪</button>
                      <button className="transport-btn" title="Avance" onClick={() => sendTransportAction(TRANSPORT_ACTION.FAST_FORWARD)}>⏩</button>
                    </div>
                  </div>
                </>
              )}

              {/* ═══ MATRICE ═══ */}
              {section === 'matrix' && (
                <>
                  <div className="section-title">
                    Matrice de routage
                    <span className="badge">MATRICE</span>
                  </div>
                  <div className="panel" style={{ overflowX: 'auto' }}>
                    <p className="panel-hint">
                      Cliquez sur une cellule pour activer ou désactiver le routage entre une entrée (ligne) et une sortie (colonne).
                      Les sorties 7–9 correspondent aux ports USB Host.
                    </p>
                    <table className="matrix-table">
                      <thead>
                        <tr>
                          <th />
                          {OUT_LABELS.map((lbl, i) => (
                            <th key={i} className={i >= 6 ? 'col-group-host' : 'col-group-trs'}>
                              {lbl}
                            </th>
                          ))}
                        </tr>
                        <tr>
                          <th />
                          {OUT_LABELS.map((_, i) => (
                            <th key={i} style={{ fontSize: 9, color: '#4b5563', paddingTop: 0, paddingBottom: 8 }}>
                              {i < 6 ? 'TRS' : 'USB'}
                            </th>
                          ))}
                        </tr>
                      </thead>
                      <tbody>
                        {IN_LABELS.map((inLbl, inIdx) => (
                          <tr key={inLbl}>
                            <td className={`row-label ${inIdx >= 2 ? 'row-label-host' : 'row-label-trs'}`}>
                              {inLbl}
                              <span className="row-sublabel">{inIdx >= 2 ? 'USB' : 'TRS'}</span>
                            </td>
                            {OUT_LABELS.map((_, outIdx) => {
                              const on = !!((dev.basicMatrix[inIdx] >> outIdx) & 1);
                              return (
                                <td key={outIdx}>
                                  <button
                                    className={`matrix-cell${on ? ' on' : ''}`}
                                    onClick={() => toggleMatrix(inIdx, outIdx)}
                                    title={`${inLbl} → ${outIdx + 1}`}
                                  />
                                </td>
                              );
                            })}
                          </tr>
                        ))}
                      </tbody>
                    </table>
                  </div>
                </>
              )}

              {/* ═══ FLUX ═══ */}
              {section === 'flux' && (
                <>
                  <div className="section-title">
                    Flux de routage
                    <span className="badge">FLUX</span>
                  </div>
                  <div className="panel">
                    <p className="panel-hint">
                      Les flux permettent un routage avancé avec filtrage par canal MIDI. Cliquez sur le canal (ALL / ch×N) pour ouvrir le sélecteur. Clic droit sur un bouton de port actif pour l'accès rapide.
                    </p>

                    <div className="flux-list">
                      {dev.fluxes.length === 0 && !showEditor && (
                        <div style={{ color: '#6b7280', fontSize: 13, padding: '8px 0' }}>
                          Aucun flux configuré.
                        </div>
                      )}
                      {dev.fluxes.map((f, idx) => f && (
                        <div key={idx} className="flux-row">
                          <div className="flux-index">F{idx + 1}</div>
                          <div className="flux-summary">{fluxSummary(f)}</div>
                          <div className="flux-actions">
                            <button
                              className="btn-sm"
                              onClick={() => {
                                setEditingIdx(idx);
                                setShowEditor(true);
                              }}
                            >
                              Éditer
                            </button>
                            <button
                              className="btn-sm danger"
                              onClick={() => deleteFlux(idx)}
                            >
                              ✕
                            </button>
                          </div>
                        </div>
                      ))}
                    </div>

                    {!showEditor && (
                      <button
                        className="btn primary"
                        style={{ marginTop: 14 }}
                        onClick={() => { setEditingIdx(null); setShowEditor(true); }}
                      >
                        + Nouveau flux
                      </button>
                    )}
                  </div>

                  {showEditor && (
                    <FluxEditor
                      editingFlux={editingIdx !== null ? dev.fluxes[editingIdx] : null}
                      editingIdx={editingIdx}
                      onSave={handleFluxSave}
                      onCancel={() => { setShowEditor(false); setEditingIdx(null); }}
                    />
                  )}
                </>
              )}

              {/* ═══ GENERATEURS ═══ */}
              {section === 'generateurs' && (
                <>
                  <div className="section-title">
                    Générateurs (LFO / Euclidien)
                    <span className="badge">GENERATEURS</span>
                  </div>
                  <div className="panel">
                    <p className="panel-hint">
                      Un générateur émet un flux MIDI en continu (CC pour un LFO, Note ON/OFF pour un
                      séquenceur euclidien), indépendamment de toute entrée — vers une ou plusieurs sorties/canaux.
                      Maximum {GEN_MAX} générateurs.
                    </p>

                    <div className="flux-list">
                      {dev.generators.length === 0 && !showGenEditor && (
                        <div style={{ color: '#6b7280', fontSize: 13, padding: '8px 0' }}>
                          Aucun générateur configuré.
                        </div>
                      )}
                      {dev.generators.map((g, idx) => g && (
                        <div key={idx} className="flux-row">
                          <div className="flux-index">L{idx + 1}</div>
                          <div className="flux-summary">{generatorSummary(g)}</div>
                          <div className="flux-actions">
                            <button
                              className="btn-sm"
                              onClick={() => {
                                setEditingGenIdx(idx);
                                setShowGenEditor(true);
                              }}
                            >
                              Éditer
                            </button>
                            <button
                              className="btn-sm danger"
                              onClick={() => deleteGenerator(idx)}
                            >
                              ✕
                            </button>
                          </div>
                        </div>
                      ))}
                    </div>

                    {!showGenEditor && dev.generators.length < GEN_MAX && (
                      <button
                        className="btn primary"
                        style={{ marginTop: 14 }}
                        onClick={() => { setEditingGenIdx(null); setShowGenEditor(true); }}
                      >
                        + Nouveau générateur
                      </button>
                    )}
                  </div>

                  {showGenEditor && (
                    <GeneratorEditor
                      editingGenerator={editingGenIdx !== null ? dev.generators[editingGenIdx] : null}
                      editingIdx={editingGenIdx}
                      onSave={handleGeneratorSave}
                      onCancel={() => { setShowGenEditor(false); setEditingGenIdx(null); }}
                    />
                  )}
                </>
              )}

              {/* ═══ HOST CONFIG ═══ */}
              {section === 'host' && (
                <>
                  <div className="section-title">
                    Configuration USB Host
                    <span className="badge">HOST CONFIG</span>
                  </div>
                  <div className="panel">
                    <p className="panel-hint">
                      Associez les ports logiques USB Host (IN C/D/E, OUT 7/8/9) aux slots physiques de l'interface.
                    </p>

                    <div>
                      <div style={{ fontSize: 12, color: '#9ca3af', marginBottom: 8, fontWeight: 600, textTransform: 'uppercase', letterSpacing: '0.04em' }}>
                        Mode de détection
                      </div>
                      <div className="mode-pill">
                        <button
                          className={`mode-pill-btn${dev.hostMode === 0 ? ' active' : ''}`}
                          onClick={() => setHostMode(0)}
                        >
                          AUTO
                        </button>
                        <button
                          className={`mode-pill-btn${dev.hostMode === 1 ? ' active' : ''}`}
                          onClick={() => setHostMode(1)}
                        >
                          MANUEL
                        </button>
                      </div>
                    </div>

                    <table className="host-table">
                      <thead>
                        <tr>
                          <th>Port logique</th>
                          <th>Slot physique</th>
                          <th>Description</th>
                        </tr>
                      </thead>
                      <tbody>
                        {[
                          { label: 'IN C',  idx: 0, desc: 'Entrée USB Host C — maps to physical slot' },
                          { label: 'IN D',  idx: 1, desc: 'Entrée USB Host D — maps to physical slot' },
                          { label: 'IN E',  idx: 2, desc: 'Entrée USB Host E — maps to physical slot' },
                          { label: 'OUT 7', idx: 3, desc: 'Sortie USB Host 7 — maps to physical slot' },
                          { label: 'OUT 8', idx: 4, desc: 'Sortie USB Host 8 — maps to physical slot' },
                          { label: 'OUT 9', idx: 5, desc: 'Sortie USB Host 9 — maps to physical slot' },
                        ].map(row => (
                          <tr key={row.idx}>
                            <td><span className="port-label-badge">{row.label}</span></td>
                            <td>
                              <select
                                className="slot-select"
                                value={dev.portSlot[row.idx] === 0x7F ? 0x7F : (dev.portSlot[row.idx] ?? 0)}
                                disabled={dev.hostMode === 0}
                                onChange={e => setPortSlot(row.idx, parseInt(e.target.value))}
                              >
                                <option value={0x7F}>—</option>
                                {[0,1,2,3,4,5].map(d => {
                                  const nm = dev.deviceNames?.[d];
                                  return (
                                    <option key={d} value={d}>
                                      {nm ? `${nm}` : `D${d + 1}`}
                                    </option>
                                  );
                                })}
                              </select>
                            </td>
                            <td className="host-desc">{row.desc}</td>
                          </tr>
                        ))}
                      </tbody>
                    </table>

                    {dev.hostMode === 0 && (
                      <div className="warning-note">
                        En mode AUTO, les slots sont détectés automatiquement. Passez en mode MANUEL pour les configurer manuellement.
                      </div>
                    )}
                  </div>
                </>
              )}

            </>
          )}

          {/* ═══ FIRMWARE ═══ — accessible même sans connexion MIDI active */}
          {midiSupported && section === 'firmware' && (
            <FirmwareSection
              send={send}
              connected={isConnected}
              showToast={showToast}
            />
          )}

          {/* ═══ DAT → MIDI ═══ — accessible sans connexion MIDI active
              (désactivé avec l'enregistrement SD continu, cf. DAT2MIDI_ENABLED) */}
          {DAT2MIDI_ENABLED && midiSupported && section === 'dat2midi' && (
            <DatToMidiSection showToast={showToast} />
          )}
        </main>
      </div>

      {/* MODAL PRESET */}
      {presetModal && (
        <div className="modal-overlay" onClick={() => setPresetModal(null)}>
          <div className="modal" onClick={e => e.stopPropagation()} style={{ minWidth: 380 }}>
            <div className="modal-title">
              {presetModal.mode === 'load' ? 'Charger un preset' : 'Sauvegarder sur le preset'}
            </div>

            {/* Templates d'usine — uniquement pour le chargement */}
            {presetModal.mode === 'load' && (
              <div style={{ marginBottom: 16 }}>
                <div className="factory-section-label">Templates d'usine</div>
                <div className="factory-row">
                  {FACTORY_PRESETS_WEB.map(tpl => (
                    <button key={tpl.name} className="factory-btn" onClick={() => applyFactory(tpl)}>
                      {tpl.name}
                    </button>
                  ))}
                </div>
                <div className="factory-section-label">Presets utilisateur</div>
              </div>
            )}

            <div className="preset-grid">
              {Array.from({ length: MAX_PRESET }, (_, i) => i + 1).map(n => (
                <button
                  key={n}
                  className={`preset-grid-btn${presetModal.selected === n ? ' active' : ''}${dev.preset === n && presetModal.selected !== n ? ' current' : ''}`}
                  onClick={() => setPresetModal(pm => ({ ...pm, selected: n }))}
                >
                  {n}
                </button>
              ))}
            </div>
            <div style={{ display: 'flex', gap: 8, justifyContent: 'flex-end' }}>
              <button className="btn" onClick={() => setPresetModal(null)}>Annuler</button>
              <button className="btn primary" onClick={confirmPresetModal}>
                {presetModal.mode === 'load' ? `Charger preset ${presetModal.selected}` : `Sauver sur preset ${presetModal.selected}`}
              </button>
            </div>
          </div>
        </div>
      )}

      {/* TOAST */}
      {toast && (
        <Toast
          key={toast.key}
          message={toast.msg}
          type={toast.type}
          onDone={() => setToast(null)}
        />
      )}
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
